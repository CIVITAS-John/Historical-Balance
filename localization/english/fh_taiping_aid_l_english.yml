l_english:
 fh_taiping_supply_arsenals: "Supply the Arsenals"
 fh_taiping_supply_arsenals_desc: "Send 10 Small Arms per week for six months through a treaty, or fund a shipment for 5% of the gold reserve limit if the treaty is unavailable. Ordinary terms allow three dispatches, six months apart. The southern terms call for 20 Small Arms per week for six months or two purchases of 10% of the gold reserve limit each, at least three months apart. Funded procurement gives the Heavenly Kingdom +10% Army Offense for six months while the rebellion lasts."
 fh_taiping_supply_arsenals_ready: "The agreed shipment is due. We need exportable Small Arms, reachable markets, a working route, and either a legal treaty or the reserves to fund it out of default."
 fh_taiping_commit_squadron: "Commit a Squadron"
 fh_taiping_commit_squadron_desc: "Detach a squadron from port. Ordinary terms send three combat ships for six months and reduce the Heavenly Kingdom's Supply Consumption by 10%. The southern terms send six combat ships for up to twelve months and reduce its Supply Consumption by 15%. The detachment reduces our Ship Power Projection by 15% or 25%, respectively."
 fh_taiping_commit_squadron_ready: "The pledge calls for a squadron, there is no active dispatch, and we have a viable fleet in port and a route to the East China Sea."
 fh_taiping_donate_ship: "Donate a Combat Ship"
 fh_taiping_donate_ship_desc: "Permanently transfer one combat ship to a Heavenly Kingdom port as an alternative to sending an ordinary squadron. The transfer counts as naval assistance for six months."
 fh_taiping_donate_ship_ready: "Ship transfer is available to both countries, neither has an active squadron commitment, and a valid combat ship and recipient port are available."
 fh_taiping_back_rebellion: "Back the Heavenly Kingdom"
 fh_taiping_back_rebellion_desc: "Take the Heavenly Kingdom's side in the original Diplomatic Play. If it escalates, we will enter the war against Qing. Supporting the play alone earns no aid credit."
 fh_taiping_back_rebellion_ready: "We must be an independent, undecided participant during the Diplomatic Maneuvers phase and have neither a truce nor an existing war with Qing."
 fh_taiping_shanghai_roads: "The Shanghai Roads"
 fh_taiping_shanghai_roads_desc: "Ask the Heavenly Kingdom to guarantee the existing foreign concessions as its army approaches Shanghai. It can gain +25% Army Offense for up to six months while these conditions hold, replacing the ordinary procurement bonus."
 fh_taiping_shanghai_roads_ready: "Arms have arrived and naval help is active. The Heavenly Kingdom must have a lower Yangtze foothold, fight no other war, and face Qing control of ordinary Shanghai."
 fh_taiping_aid.5.t: "The Shanghai Roads"
 fh_taiping_aid.5.d: "The Zheng court offers to keep its naval assistance on the Shanghai approaches if we guarantee the foreign concessions. Qing still controls the Chinese city. We would have to win it ourselves."
 fh_taiping_aid.5.agree: "Give the settlements a written guarantee."
 fh_taiping_aid.5.decline: "Keep the fleet clear."
 fh_taiping_shanghai_guarantees_tt: "The Heavenly Kingdom gains +25% Army Offense for up to six months while the Shanghai opportunity remains open. This replaces any ordinary procurement bonus."
 fh_taiping_arms_agreement: "The Taiping Arms Shipments"
 fh_taiping_procurement_bonus: "Tungning Arms Deliveries"
 fh_taiping_shanghai_offensive: "The Shanghai Offensive"

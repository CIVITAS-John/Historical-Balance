l_english:
 law_fh_mandate_of_heaven: "Mandate of Heaven"
 law_fh_mandate_of_heaven_desc: "The sovereign rules by Heaven's mandate and owes order and protection to the peoples of the realm."
 law_fh_port_and_village_registers: "Port and Village Registers"
 law_fh_port_and_village_registers_desc: "The court recognizes communities through their homes and harbors. Until the return to the mainland, the registers also help muster local levies."
 law_fh_banner_estates: "Banner Estates"
 law_fh_banner_estates_desc: "The court upholds the great estates and reserves a share of the land for the households that work it."
 law_fh_anping_trade_charters: "Anping Trade Charters"
 law_fh_anping_trade_charters_desc: "Licensed merchant houses ship goods abroad from Anping under favorable export duties."
 law_fh_confucian_academies: "Confucian Academies"
 law_fh_confucian_academies_desc: "The court supports local academies where teachers pass on the classics and prepare pupils for public service."
 fh_register_conscription: "Port and Village Levies"
 fh_register_conscription_desc: "Household rolls help the court muster recruits until it completes the return to the mainland."

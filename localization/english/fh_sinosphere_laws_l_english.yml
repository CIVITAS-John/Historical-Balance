l_english:
 law_fh_mandate_of_heaven: "Mandate of Heaven"
 law_fh_mandate_of_heaven_desc: "A dynasty holds the realm only while Heaven lent it the mandate, a gift the people may read in harvests, floods and the courage of its armies. The sovereign owes the country order and protection in return. A throne that cannot keep them has already been judged."
 law_fh_port_and_village_registers: "Port and Village Registers"
 law_fh_port_and_village_registers_desc: "The court counts its people by hearth and harbor: every household on the rolls, every hull in the roads. Until the return to the mainland is accomplished, those same registers are also the muster list for the local levies."
 law_fh_banner_estates: "Banner Estates"
 law_fh_banner_estates_desc: "The court upholds the great estates and leaves a share of the land to the households that plough it, buying the loyalty of the gentry with soil and the goodwill of the villages with a little of it."
 law_fh_anping_trade_charters: "Anping Trade Charters"
 law_fh_anping_trade_charters_desc: "Chartered houses ship from Anping on favorable export duties, and their papers carry the court's favor to every port that will hear it. What was licensed for a season has become the custom of the harbor."
 law_fh_confucian_academies: "Confucian Academies"
 law_fh_confucian_academies_desc: "The court endows local academies where teachers pass on the classics, rehearse the rites, and prepare promising pupils for office. A boy from a poor village may sit where the sons of magistrates sit, if his calligraphy earns him the ink."
 fh_register_conscription: "Port and Village Levies"
 fh_register_conscription_desc: "The household rolls mustered for the tax collector serve the recruiting sergeant too, and will keep doing so until the court completes its return to the mainland."

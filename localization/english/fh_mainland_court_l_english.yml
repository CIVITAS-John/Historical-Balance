 fh_read_ming_memorials: "Read the Ming Memorials"
 fh_read_ming_memorials_desc: "Hear the old memorials in open court and ask what Tungning still owes the mainland."
 fh_hear_strait_merchants: "Hear the Strait Merchants"
 fh_hear_strait_merchants_desc: "Ask the merchants what the island stands to gain by settling with Qing."
 fh_mainland_court_action_open_tt: "No court action is awaiting a reply, and six months have passed since the last confirmed action."
 fh_mainland_memorial_has_sponsor_tt: "The governing Ming Estates, a governing mainland-first Army and Fleet, or a governing group other than the Army and Fleet led by a Jingoist, Royalist, or Traditionalist can sponsor the reading."
 fh_mainland_merchants_have_sponsor_tt: "The governing Maritime Houses, governing Petite Bourgeoisie, governing southern-expedition Army and Fleet, or another governing group led by a Pacifist or Market Liberal can sponsor the hearing. The Ming Estates can also sponsor it while in government under Qing’s embargo."
 fh_mainland_court.cancel: "Leave the matter for another day."

 fh_mainland_court.1.t: "Read the Ming Memorials"
 fh_mainland_court.1.d: "A clerk brings out the memorials carried from Fujian by the first exiles. For a century their descendants have read them in private. Reading them aloud in open court would give the old cause a place in the island’s business again."
 fh_mainland_court.1.confirm: "Read them into the record."
 fh_mainland_court.1.confirm_tt: "Move the court balance #P +12#! toward reassertion. For six months, the sponsor gains #P +2#! Approval, the Maritime Houses receive #N −2#! Approval, and Tungning gains #bold Memorial Preparations#! (#N +5%#! Military Goods Cost)."

 fh_mainland_court.2.t: "Hear the Strait Merchants"
 fh_mainland_court.2.d: "The merchants unfold invoices for wares once sold across the strait. On several of them, the place where the buyer’s seal should be has been left empty. They would like the court to hear how much longer the warehouses can afford to wait."
 fh_mainland_court.2.confirm: "Give them a hearing."
 fh_mainland_court.2.confirm_tt: "Move the court balance #N −12#! toward renunciation. For six months, the sponsor gains #P +2#! Approval and Tungning’s Taiwan gains #bold The Merchants’ Hearing#! (#P +10%#! Trade Advantage). The Ming Estates receive #N −2#! Approval unless they sponsored the hearing."

 fh_mainland_petition_plus_tt: "Move the court balance #P +5#! toward reassertion. Another petition cannot arrive for 12 months."
 fh_mainland_petition_minus_tt: "Move the court balance #N −5#! toward renunciation. Another petition cannot arrive for 12 months."

 fh_mainland_court.11.t: "A Favor from Canton"
 fh_mainland_court.11.d: "Canton brokers have quietly found buyers for an island cargo that was about to spoil. They ask us to remember the favor. Some see a line of contact that the court ought to keep for itself; others see proof that business is easier without a royal seal."
 fh_mainland_court.11.mainland: "Keep the brokers in the court’s confidence."
 fh_mainland_court.11.accommodate: "Let the merchants repay a merchant’s favor."

 fh_mainland_court.12.t: "A Letter from Fujian"
 fh_mainland_court.12.d: "County officials in Fujian offer to let the exiles’ families visit their ancestral graves. The families would have to travel as private persons. The officials will admit no representative of the Ming court, even for a day."
 fh_mainland_court.12.mainland: "Send word that we will receive the officials ourselves."
 fh_mainland_court.12.accommodate: "Let the families make the crossing."

 fh_mainland_court.13.t: "A Petition from the Island Ports"
 fh_mainland_court.13.d: "Merchants in Taiwan have subscribed to refit several ships. Their petition asks to keep the ships on their usual trading runs. The arsenals have submitted a competing estimate for fitting out the same hulls to carry stores to the coast."
 fh_mainland_court.13.mainland: "Have the arsenals present their plans."
 fh_mainland_court.13.accommodate: "Leave the ships in the carrying trade."

 fh_mainland_court.14.t: "The Young Officers’ Petition"
 fh_mainland_court.14.d_mainland: "The junior officers have assembled a chart of the Fujian coast. At the head of their petition their commander asks the court to prepare an expedition while there is still time to choose the landing."
 fh_mainland_court.14.d_southern: "The junior officers report that several of the island’s southern anchorages are short of stores. At the head of their petition their commander asks the court to keep the squadron in the south."
 fh_mainland_court.14.d_neutral: "The officers’ new commander has withdrawn their petition. The squadron will follow its standing orders."
 fh_mainland_court.14.back: "Back the officers in open court."
 fh_mainland_court.14.back_tt: "Remove #P 2%#! Radicals among Army and Fleet supporters. For one year, #bold Officers at the Ready#! grants #P +10%#! Naval Power Projection and #N +5%#! Military Goods Cost."
 fh_mainland_court.14.refuse: "Return their petition unsigned."
 fh_mainland_court.14.refuse_tt: "The Army and Fleet receive #N −2#! Approval for six months."

 fh_mainland_court.15.t: "The Families Who Crossed"
 fh_mainland_court.15.d: "Families driven from the mainland have brought lists of those who could not follow them. Some ask the court to send ships for the rest. Others ask only for land, work, and a place to put down what they carried."
 fh_mainland_court.15.mainland: "Hear those who still hope to go home."
 fh_mainland_court.15.accommodate: "Help them make a home here."

 fh_mainland_court.16.t: "A Petition from the Zhu Household"
 fh_mainland_court.16.d: "The Zhu household asks the sovereign to receive the family under its old titles. They would bring the registers of the imperial clan with them. The chamberlain has set out a second form of invitation for a private visit."
 fh_mainland_court.16.mainland: "Receive them under their old titles."
 fh_mainland_court.16.accommodate: "Invite them as private guests."


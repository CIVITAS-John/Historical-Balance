 fh_read_ming_memorials: "Read the Ming Memorials"
 fh_read_ming_memorials_desc: "Hear the old memorials in open court and ask what Tungning still owes the mainland."
 fh_hear_strait_merchants: "Hear the Strait Merchants"
 fh_hear_strait_merchants_desc: "Ask the merchants what the island stands to gain by settling with Qing."
 fh_mainland_court_action_open_tt: "No court action awaits a reply, and six months have passed since the last confirmed action."
 fh_mainland_memorial_has_sponsor_tt: "Government sponsor: Ming Estates, mainland-first Army and Fleet, or another group led by a Jingoist, Royalist, or Traditionalist."
 fh_mainland_merchants_have_sponsor_tt: "Government sponsor: Maritime Houses, Petite Bourgeoisie, southern-expedition Army and Fleet, or another group led by a Pacifist or Market Liberal. Ming Estates qualify under Qing’s embargo."
 fh_mainland_court.cancel: "Leave the matter for another day."

 fh_mainland_court.1.t: "Read the Ming Memorials"
 fh_mainland_court.1.d: "A clerk unties the bundle with his penknife, and the hall smells of camphor and old rain. The memorials came over with the first exiles; their descendants have read them at home, in low voices, for a hundred years. Nobody in the hall has heard them aloud. The reader clears his throat."
 fh_mainland_court.1.confirm: "Read them into the record."
 fh_mainland_court.1.confirm_tt: "#P +12#! toward reassertion. For six months: #P +2#! sponsor Approval, #N −2#! Maritime Houses Approval, and #bold Memorial Preparations#! (#N +5%#! Military Goods Cost)."

 fh_mainland_court.2.t: "Hear the Strait Merchants"
 fh_mainland_court.2.d: "The merchant spreads the invoices flat and weights one corner with a warehouse key. Every sheet lists goods that once went across the strait: sugar, rattan, a hundred bolts of cloth. The place for the buyer’s seal is still blank. ‘The rent falls due on the eighth,’ he says, ‘and the warehouse has not cleared a floor since spring.’"
 fh_mainland_court.2.confirm: "Give them a hearing."
 fh_mainland_court.2.confirm_tt: "#N −12#! toward renunciation. For six months: #P +2#! sponsor Approval and Taiwan’s #bold The Merchants’ Hearing#! (#P +10%#! Trade Advantage). Ming Estates: #N −2#! Approval unless they sponsored."

 fh_mainland_petition_plus_tt: "Move the court balance #P +5#! toward reassertion. Another petition cannot arrive for 12 months."
 fh_mainland_petition_minus_tt: "Move the court balance #N −5#! toward renunciation. Another petition cannot arrive for 12 months."

 fh_mainland_court.11.t: "A Favor from Canton"
 fh_mainland_court.11.d: "The Canton man sets a jar of tea on the table and lays a broker’s chit beside it. The hold had been sweating; the brokers found buyers in three days. Now he asks that the court remember who found them. A collector reaches for the court seal. A shipowner puts his hand flat on the paper and says a merchant’s favor can be repaid without one."
 fh_mainland_court.11.mainland: "Keep the brokers in the court’s confidence."
 fh_mainland_court.11.accommodate: "Let the merchants repay a merchant’s favor."

 fh_mainland_court.12.t: "A Letter from Fujian"
 fh_mainland_court.12.d: "The letter comes from a county yamen in Fujian, on official paper and stamped with a magistrate’s plain seal. It lists the graves by village and the families who may come as private persons. No one bearing the court’s commission will be admitted, it says, not for a single day. A minister reads it twice before he sets it down."
 fh_mainland_court.12.mainland: "Send word that we will receive the officials ourselves."
 fh_mainland_court.12.accommodate: "Let the families make the crossing."

 fh_mainland_court.13.t: "A Petition from the Island Ports"
 fh_mainland_court.13.d: "The shipowners’ petition comes with a subscription list and the names of nine hulls. The arsenals answer with an estimate for the same nine, fitted to carry stores to the coast instead of crates of camphor. A shipwright at the back has worked on all of them; he keeps looking from one list to the other and says nothing."
 fh_mainland_court.13.mainland: "Have the arsenals present their plans."
 fh_mainland_court.13.accommodate: "Leave the ships in the carrying trade."

 fh_mainland_court.14.t: "The Young Officers’ Petition"
 fh_mainland_court.14.d_mainland: "The junior officers unroll the chart on the floor and set the corners down with inkstones. Their commander kneels at the edge and traces the Fujian coast with one finger, stopping at a river mouth. ‘The landing is not the difficulty,’ he says. ‘Choosing it before Qing does is.’ A lieutenant beside him has already written the request on the back of the chart."
 fh_mainland_court.14.d_southern: "A stores return lies open on the table, three southern anchorages marked short of powder, one of rice. Their captain has written the request in the margin. ‘We can hold the south,’ he tells the court, ‘if nobody sends us north to hold nothing.’ A purser behind him nods at every figure."
 fh_mainland_court.14.d_neutral: "The new commander returns the officers’ petition without reading it aloud. He folds it in half, then in quarters, and puts it inside his coat. The lieutenant who drew the chart rolls it up slowly, watching the court. ‘The squadron keeps to standing orders,’ the commander says. The lieutenant does not move."
 fh_mainland_court.14.back: "Back the officers in open court."
 fh_mainland_court.14.back_tt: "Remove #P 2%#! Radicals among Army and Fleet supporters. #bold Officers at the Ready#! (1 year): #P +10%#! Naval Power Projection, #N +5%#! Military Goods Cost."
 fh_mainland_court.14.refuse: "Return their petition unsigned."
 fh_mainland_court.14.refuse_tt: "The Army and Fleet receive #N −2#! Approval for six months."

 fh_mainland_court.15.t: "The Families Who Crossed"
 fh_mainland_court.15.d: "The families crowd the lower end of the hall, still carrying what came off the boat: a bedroll, a rice pot, a sewing frame. One man reads a list of eleven names left behind and asks for a ship. A woman behind him says she has no one left to send for, and asks only for a piece of ground and work for her sons."
 fh_mainland_court.15.mainland: "Hear those who still hope to go home."
 fh_mainland_court.15.accommodate: "Help them make a home here."

 fh_mainland_court.16.t: "A Petition from the Zhu Household"
 fh_mainland_court.16.d: "The chamberlain sets two cards on the tray: one gives the Zhu household an audience under its old titles, the other invites them as private guests. The old retainer who carries the clan register has dust on his sleeves from the road. He waits beside the tray without touching either card, and asks which door the family should come to."
 fh_mainland_court.16.mainland: "Receive them under their old titles."
 fh_mainland_court.16.accommodate: "Invite them as private guests."


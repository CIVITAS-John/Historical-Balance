l_english:
 fh_je_southern_passage: "The Southern Passage"
 fh_je_southern_passage_reason: "The merchants write Tungning on the manifests they carry to West Borneo. They ask the court how much longer its seal will get their cargo past the Dutch stations.\n\nKeep the passage by holding one of the opening grants through 24 consecutive monthly fleet checks, or by enforcing a demand for ordinary Indonesian territory against the Dutch rival. Humiliation counts too, but only in a direct dispute with that rival, and only if the rival held ordinary land in Indonesia when the play began.\n\nAt 100 pressure or on the fifth anniversary, an unsettled dispute can cost the court its remaining opening parcels in West Borneo. A play or war already under way against the rival can put off the reckoning. While the dispute is open, the West Borneo state suffers −10% Trade Advantage if it holds a tracked parcel."
 fh_southern_passage_deadline_status: "Concessions fall due on #v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'fh_southern_passage_deadline'))]#! or at 100 pressure."
 fh_southern_passage_fleet_status: "Naval projection: our fleet #v [ROOT.GetCountry.MakeScope.ScriptValue('fh_southern_passage_own_navy')|1]#!, the Dutch rival #v [ROOT.GetCountry.MakeScope.ScriptValue('fh_southern_passage_dutch_navy')|1]#!. We must match the Dutch and our own opening target of #v [ROOT.GetCountry.MakeScope.ScriptValue('fh_southern_passage_demonstration_min_navy')|1]#!."
 fh_southern_passage_dispute_status: "$fh_southern_passage_deadline_status$\n$fh_southern_passage_fleet_status$\nThe demonstration has not begun."
 fh_southern_passage_demonstration_status: "$fh_southern_passage_deadline_status$\n$fh_southern_passage_fleet_status$\nConsecutive qualifying checks: #v [ROOT.GetCountry.MakeScope.ScriptValue('fh_southern_passage_streak')|0]#!/24. A failed check, or the loss of an opening grant, breaks the count."
 fh_southern_passage_demonstration_blocked_status: "$fh_southern_passage_demonstration_status$\nThe fleet falls short of its requirements; it must meet them again before the next monthly check."
 fh_southern_passage_occupation_status: "The Dutch rival has lost its footing under a temporary war goal. The court is awaiting permanent terms before it settles the dispute."
 fh_southern_passage_due_status: "Concessions have fallen due. The court is reading the fleet’s last returns and any demand it has enforced."
 fh_southern_passage_hold_status: "Pressure and fleet checks are suspended. Only a qualifying demand enforced in the conflict already under way can secure the route. The court settles the dispute when that conflict ends."
 fh_southern_passage_pressure: "Dutch Pressure"
 fh_southern_passage_concession_limit: "Concessions fall due"
 fh_southern_passage_drift_pressure: "Dutch pressure on the route"
 fh_southern_passage_drift_navy: "Stronger effective Dutch fleet"
 fh_southern_passage_drift_debt: "Default or at least 75% of credit used"
 fh_southern_passage_drift_embargo: "Dutch embargo"
 fh_southern_passage_drift_relations: "Relations with the rival at +20 or higher"
 fh_southern_passage_drift_other_war: "Dutch fleet occupied by another war"
 fh_southern_passage_drift_trade_center: "West Borneo outtrades the rival’s largest Indonesian trade center"
 fh_southern_passage_drift_guarantee: "British or East India Company protection"
 fh_southern_passage_enforced_header: "Secure the passage by an enforced demand"
 fh_southern_passage_enforced_desc: "An enforced demand has secured the passage."
 fh_southern_passage_lost_header: "Lose all tracked opening grants"
 fh_southern_passage_lost_desc: "The last opening grant is gone. No land was ceded under Dutch demands."
 fh_southern_passage_no_rival_header: "No Dutch rival still qualifies"
 fh_southern_passage_no_rival_desc: "No Dutch rival remains able to press the dispute."
 fh_southern_passage_demonstrated_header: "Complete the naval demonstration"
 fh_southern_passage_demonstrated_desc: "The fleet has kept the passage open for 24 consecutive qualifying checks."
 fh_southern_passage_conceded_header: "Concede when the dispute falls due"
 fh_southern_passage_conceded_desc: "Dutch demands prevailed. Only opening parcels in West Borneo could be ceded; the tributary courts kept their status."

 fh_southern_passage_tariff_challenge: "Issue the Tariff Challenge"
 fh_southern_passage_tariff_challenge_desc: "Lower the ceiling on export duties and ease the pressure on southern shipping."
 fh_southern_passage_tariff_challenge_tt: "Dutch Pressure decreases by #v 12#!. The Maritime Houses gain #p +2#! Approval for one year. The maximum export tariff falls by #v 10 percentage points#! for one year or until the dispute is suspended or the court loses control of tariff policy. This does not change import duties or per-good settings. The action can be used again after one year."
 fh_southern_passage_military_challenge: "Issue the Military Challenge"
 fh_southern_passage_military_challenge_desc: "Send the fleet out to show that the court can keep the route open. Hold it to its target and keep an opening grant through 24 consecutive monthly checks."
 fh_southern_passage_military_challenge_tt: "Relations with the Dutch rival fall by #n 20#!. Naval goods cost #n 25%#! more until the demonstration is suspended or the dispute closes. For one year, the Maritime Houses lose #n 2#! Approval and the Army and Fleet gain #p 2#! under a southern-expedition leader or lose #n 2#! under a mainland-first leader. The challenge can be issued only once."
 fh_southern_passage_actions_open_tt: "The dispute is active and no settlement is pending."
 fh_southern_passage_tariff_policy_tt: "The court controls its market’s tariff policy and has Mercantilism, Anping Trade Charters, or Protectionism."
 fh_southern_passage_tariff_ready_tt: "The Tariff Challenge has not been used in the past year."
 fh_southern_passage_demonstration_unused_tt: "The Military Challenge has not been issued."
 fh_southern_passage_naval_ready_tt: "The court is not in default, has an active Interest in Indonesia, and matches both the effective Dutch fleet and 120% of its own opening projection."

 fh_southern_passage_action.11.t: "Merchants Ask for Escorts"
 fh_southern_passage_action.11.d: "A shipping delegate lays a list of boats on the fleet clerk’s desk. Cotton and porcelain are already aboard, but the masters will not risk West Borneo without an escort. The delegate waits while the clerk reads down the names."
 fh_southern_passage_action.11.f: "[SCOPE.sCharacter('fh_southern_passage_merchant').GetFullName] has signed beside the captains."
 fh_southern_passage_action.11.a: "Pay for the escorts."
 fh_southern_passage_action.11.a_tt: "Dutch Pressure falls by #v 5#!. Naval goods cost #n 10%#! more for one year or until the dispute closes. This does not stack with another paid escort."
 fh_southern_passage_action.11.b: "Let the merchants arrange passage."
 fh_southern_passage_action.11.b_tt: "Dutch Pressure rises by #v 5#!. Our eligible West Borneo state gains #p +10%#! Trade Advantage for six months."
 fh_southern_passage_action.12.t: "The Dutch Fleet Is Called Away"
 fh_southern_passage_action.12.d: "A captain comes ashore with word that the ships watching the southern route have been called to another war. The squadron can use their absence, but the quartermaster will need fresh stores."
 fh_southern_passage_action.12.f: "[SCOPE.sCharacter('fh_southern_passage_admiral').GetFullName] has brought the fleet’s readiness report."
 fh_southern_passage_action.12.a: "Send out the squadron."
 fh_southern_passage_action.12.a_tt: "Dutch Pressure falls by #v 5#! and relations with the rival fall by #n 5#!. Naval goods cost #n 10%#! more for one year or until the dispute closes. This does not stack with another paid escort."
 fh_southern_passage_action.12.b: "Keep to the usual routes."
 fh_southern_passage_action.12.b_tt: "Dutch Pressure rises by #v 5#!. The Maritime Houses gain #p +2#! Approval for six months."
 fh_southern_passage_action.dismiss: "File the report."

 fh_southern_passage_system.acknowledge: "Enter it in the records."
 fh_southern_passage_system.50.t: "The Cost of the Southern Route"
 fh_southern_passage_system.50.d: "The harbor clerks bring word that Dutch pressure has reached 50. The merchants ask whether to send the next cargo or hold it on the quay."
 fh_southern_passage_system.75.t: "A Reckoning Nears"
 fh_southern_passage_system.75.d: "Dutch pressure has reached 75. If the dispute is still unsettled at 100 pressure or on the fifth anniversary, the court may have to give up its remaining opening parcels in West Borneo."
 fh_southern_passage_system.101.t: "The Southern Route Secured"
 fh_southern_passage_system.101.d: "The terms the court enforced can be read aloud in the ports. The court gains #p +20#! Prestige for six years. Radicals fall by 5% among supporters of southern-expedition officers and rise by 2% among supporters of the Maritime Houses."
 fh_southern_passage_system.101.local: "$fh_southern_passage_system.101.d$ The West Borneo state also gains #p +15%#! Trade Advantage for six years while it retains an opening parcel."
 fh_southern_passage_system.102.t: "The Southern Outposts Are Lost"
 fh_southern_passage_system.102.d: "The last opening grant has slipped from the court’s hands. No parcel was ceded under Dutch demands. The court loses #n 10#! Prestige for two years, and radicals rise by 5% among Maritime Houses supporters."
 fh_southern_passage_system.103.t: "The Pressure Lifts"
 fh_southern_passage_system.103.d: "No Dutch rival is left to carry the dispute. The court gains #p +10#! Prestige for two years, and radicals fall by 2% among Maritime Houses supporters."
 fh_southern_passage_system.104.t: "The Fleet Has Kept the Passage"
 fh_southern_passage_system.104.d: "The fleet’s returns show twenty-four consecutive months of readiness. The court gains #p +15#! Prestige for four years. Radicals fall by 5% among Maritime Houses supporters, and relations with the Dutch rival improve by 5."
 fh_southern_passage_system.104.local: "$fh_southern_passage_system.104.d$ The West Borneo state also gains #p +10%#! Trade Advantage for four years while it retains an opening parcel."
 fh_southern_passage_system.105.t: "Dutch Demands Prevail"
 fh_southern_passage_system.105.aftermath: "The court loses #n 10#! Prestige for three years. Radicals rise by 5% among supporters of the Maritime Houses and of southern-expedition officers."
 fh_southern_passage_system.105.d: "The court yields the dispute. No land changes hands, and the tributary courts keep their existing status. $fh_southern_passage_system.105.aftermath$"
 fh_southern_passage_system.105.land: "The court cedes #v [ROOT.GetCountry.MakeScope.ScriptValue('fh_southern_passage_ceded_count')|0]#! tracked West Borneo parcels to the Dutch rival. The tributary courts keep their existing status. $fh_southern_passage_system.105.aftermath$"


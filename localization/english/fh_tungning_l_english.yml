 fh_tungning_fading_maritime_prestige: "Legacy of the Zheng Fleet"
 fh_tungning_fading_maritime_prestige_desc: "Under Zheng Zhilong and then Koxinga the 鄭 banner was a passport: it opened every harbor from Manila to Nagasaki, and a junk flying it paid its charges at the point of a gun if need be. The flag still wins an audience at any foreign quay. The audience now costs money, and the money has gone."

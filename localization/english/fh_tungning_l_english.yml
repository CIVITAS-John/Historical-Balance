 fh_tungning.1.t: "An Island Missing from the Record"
 fh_tungning.1.d: "Kangxi’s fleet returned without Taiwan. Daoguang keeps the embargo, but fishing boats still carry letters across the strait. The dispatches in Beijing record why no second expedition has sailed."
 fh_tungning.1.a: "Remain with the Great Qing"
 fh_tungning.1.b: "Play as the Kingdom of Tungning"
 fh_tungning.1.c: "Read the coastal dispatches"
 fh_tungning.7.t: "Dispatches from the Coast"
 fh_tungning.7.d: "After the defeat at Hetongpo, Yongzheng needed his men in the northwest. Qianlong wanted Taiwan among his Ten Great Campaigns, but He Shen warned that the Zheng fleet could cut an army’s supply line. The minister found another use for the island: private accounts that bought better firearms for Qing arsenals and put them in touch with foreign gunsmiths. Jiaqing had He Shen put to death in 1799. The accounts closed; the embargo remained. Fujian families still cross when they can, and a few bring the Catholic faith home."
 fh_tungning.7.a: "Back"
 fh_tungning.2.t: "The Crown Across the Strait"
 fh_tungning.2.d: "At the first audience of 1836, three memorials await Zheng Wenhai. The Zhu princes still honor the Ming; the missions petition for their schools; the harbor accounts show what it costs to keep the fleet at sea. The king must decide which obligations his house can afford."
 fh_tungning.2.a: "Take up the court's business"
 fh_tungning.2.b: "Read the Zheng chronicle"
 fh_tungning.2.c: "Hear the missions’ petitions"
 fh_tungning.2.d_details: "Open the harbor ledgers"
 fh_tungning.4.t: "The Succession and the Ming Claim"
 fh_tungning.4.d: "Koxinga kept Shi Lang in his service, confined Zheng Jing, and put Feng Xifan to death. When Koxinga died during the Manila expedition, Chen Yonghua negotiated the withdrawal. The settlers he brought to Taiwan helped Jing hold Xiamen longer and gave his retreating forces a home when Qing took back the coast.\n\nWith Feng gone, no palace coup barred Kezang’s succession. In 1683, Shi Lang turned back Kangxi’s fleet with Spanish supplies. Zhu Shugui kept his estates and presided over the Ming rites. His heirs still tend the ancestral tablets; what the Zheng owe the old dynasty remains a question for the throne."
 fh_tungning.4.a: "Back"
 fh_tungning.5.t: "Manila, the Missions, and Sinkan"
 fh_tungning.5.d: "Manila offered powder, supplies, and access to Spanish markets. Zheng Kezang accepted the Catholic faith, invoking a promise made in the name of the Yongli court. The Yongli Articles now extend to other congregations the shelter the missions once sought for themselves. In Sinkan, a few Siraya congregations still keep the Reformed faith handed down from Dutch rule."
 fh_tungning.5.a: "Back"
 fh_tungning.6.t: "Ledgers of Trade and the Fleet"
 fh_tungning.6.d: "The ledgers at Anping record porcelain, silk, and tea for Manila; a license from the shogunate for Nagasaki; and a warehouse lease in Busan neither court cares to advertise. Tungning administers Lanfang and has won tributary ties with Sintang, Selangor, and Bulungan. Sambas and Pontianak now send their tribute to Anping instead of Batavia. Spain’s reach is shrinking, and Dutch and Company merchants take more of the freight each year. The ships that kept the kingdom free still need timber, powder, and pay. Wenhai inherits the bills as well as the flag."
 fh_tungning.6.a: "Back"
 fh_tungning.2.f: "At the year's first audience, [SCOPE.sCharacter('fh_xu_wenjing').GetFullName] lays a copy of his ancestor Xu Guangqi's geometry beside the memorials. Father [SCOPE.sCharacter('fh_luo_jingde').GetFullName] asks the court to endow the mission schools. From Sinkan, the Reformed schoolmaster [SCOPE.sCharacter('fh_samuel_talavan').GetFullName] brings a different petition: let his congregation print its own readers."
 fh_coastal_migration.1.t: "Passage Across the Sea"
 fh_coastal_migration.1.d: "Letters from [SCOPE.sState('fh_coastal_destination').GetName] are read aloud on the docks at [SCOPE.sState('fh_coastal_origin').GetName]: work, rooms to let, passage paid by cousins. The first families have booked; others are selling what they cannot carry."
 fh_coastal_migration.2.t: "Boats Before Dawn"
 fh_coastal_migration.2.d: "The patrol in [SCOPE.sState('fh_coastal_origin').GetName] found the landing empty at sunrise. The families had already put out for [SCOPE.sState('fh_coastal_destination').GetName] with what they could carry."
 fh_coastal_migration.a: "They have made their choice."

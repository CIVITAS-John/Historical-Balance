 fh_tungning.1.t: "An Island Missing from the Record"
 fh_tungning.1.d: "‘There’s no chapter for Taiwan,’ the copyist said, turning the last page of Qianlong’s campaigns. Beside the book lay a dispatch from Fujian. Fishing boats were carrying letters across the strait again, and the patrol asked for two more ships to hold Daoguang’s embargo. The secretary wrote ‘coastal routine’ across the corner of the dispatch. ‘You haven’t missed a chapter,’ he said.\n\n‘A chapter is a victory someone can price,’ he went on. ‘An island the fleet cannot take is cheaper to leave out.’ The Ten Great Campaigns were cut in stone at Chengde; the tenth was written up with no siege and no fleet, and no one at court has ever been shown its accounts. The copyist turned the page back and ruled a blank line at the foot of the campaign. He left it empty."
 fh_tungning.1.a: "Remain with the Great Qing"
 fh_tungning.1.b: "Play as the Kingdom of Tungning"
 fh_tungning.1.c: "Read the coastal dispatches"
 fh_tungning.7.t: "Dispatches from the Coast"
 fh_tungning.7.d: "The clerk in Fuzhou lifted the lid on a box marked ‘coastal miscellany.’ The oldest report told how Kangxi's expedition had been turned back in 1683 by the fleet the Qing had taught to sail, after the island bought Spanish powder with a king's conversion. After the defeat at Hetongpo, Yongzheng’s orders sent the men northwest instead. Qianlong had asked about the island again, and He Shen’s memorandum asked who would feed an army once the Zheng cut the crossing.\n\nBeneath it lay a ledger in He Shen’s own hand: firearms bought through Tungning merchants, a foreign gunsmith passed to a Qing arsenal, the embezzlement that paid for both. The last entry was dated 1799, the year Jiaqing had him put to death, and the trade in arms closed with the accounts. The newest dispatch mentioned a fisherman back from his daughter’s house in Taiwan with a rosary in his pocket. It had been filed with the requests for more patrol ships."
 fh_tungning.7.a: "Back"
 fh_tungning.2.t: "The Crown Across the Strait"
 fh_tungning.2.d: "At his first audience of 1836, Zheng Wenhai heard rain dripping into a basin behind the throne. The chamberlain opened the court’s own record in the old form: Great Ming, the year counted from Yongli. He laid the Zheng chronicle beside it with the missions’ petitions. The treasurer came last with the harbor accounts and began to slide them under the other papers. The top ledger was ruled for the Anping customs, and every clearance in it was entered under the name Tungning. ‘Leave those where I can reach them,’ Wenhai said."
 fh_tungning.2.a: "Take up the court’s business"
 fh_tungning.2.b: "Read the Zheng chronicle"
 fh_tungning.2.c: "Hear the missions’ petitions"
 fh_tungning.2.d_details: "Open the harbor ledgers"
 fh_tungning.4.t: "The Succession and the Ming Claim"
 fh_tungning.4.d: "In the chronicle, the mark beside Feng Xifan’s name was a single stroke. Wenhai asked what it meant. ‘He sold the succession,’ the keeper said. ‘Koxinga had him strangled. Jing lived, under his father’s eye, and Shi Lang kept his command.’ He turned the page. At Manila, when Koxinga died, Chen Yonghua bargained for safe passage, and the settlers came to Taiwan with the fleet. Their households carried Jing back into Fujian and held Xiamen until Qing recovered the coast. No coup barred Kezang’s succession. In 1683 Shi Lang met Kangxi’s fleet with Spanish powder and turned it back. Wenhai asked where the chronicle left the Ming. The keeper closed the book. ‘Zhu Shugui kept his estates and tended the tablets,’ he said. ‘No Zhu has worn the crown since, but his house still lights the incense.’"
 fh_tungning.4.a: "Back"
 fh_tungning.5.t: "Manila, the Missions, and Sinkan"
 fh_tungning.5.d: "The ink had faded where the envoy from Manila listed what Spain would send: powder, stores, access to its markets. The clerk could still make out the cargoes promised in return: porcelain, silk, tea. At the foot of the letter he lowered his lamp to read Kezang’s answer. The king had accepted the Catholic faith and called it the keeping of Yongli’s promise.\n\nA mission priest waited for a copy. Beside him a delegate from Sinkan laid down a second petition. ‘Our congregation kept the Reformed faith after the Dutch left,’ he said, and opened a reader to a page of Siraya set in Latin letters. The clerk opened the Yongli Articles to see whose petition to enter. There was room in the register for both, which no one at the table had expected."
 fh_tungning.5.a: "Back"
 fh_tungning.6.t: "Ledgers of Trade and the Fleet"
 fh_tungning.6.d: "‘Read me the Manila account,’ Wenhai said. The Anping clerk opened the ledger: porcelain, silk, tea. The Nagasaki license was renewed; the Busan lease was paid to a landlord neither court would name. Then came Lanfang’s garrison, and the tribute from Sintang, Selangor and Bulungan, and from Sambas and Pontianak, which had gone to Batavia in his grandfather’s day. ‘All this comes to us,’ Wenhai said. ‘Yes,’ the clerk said, ‘and Manila’s orders shrink while the Dutch and the Company take more of the freight.’ He turned to the last page. The fleet’s pay list ran past the edge of the paper. Wenhai put his finger on the empty margin. ‘What is this?’ ‘The estimate for the next quarter, Your Highness. We have not found the money.’"
 fh_tungning.6.a: "Back"
 fh_tungning.2.f: "[SCOPE.sCharacter('fh_samuel_talavan').GetFullName] opened a Siraya reader to a page mended with a strip of paper. [SCOPE.sCharacter('fh_xu_wenjing').GetFullName] laid Xu Guangqi’s geometry beside it to keep the leaf flat. Father [SCOPE.sCharacter('fh_luo_jingde').GetFullName] reached to turn it. ‘Wait,’ Talavan said. ‘The first letter is under your thumb.’"
 fh_coastal_migration.1.t: "Passage Across the Sea"
 fh_coastal_migration.1.d: "On the [SCOPE.sState('fh_coastal_origin').GetName] waterfront, a shipping agent read the [SCOPE.sState('fh_coastal_destination').GetName] letter aloud a second time: work, rooms to let, passage paid by cousins. A carpenter set his plane on the table he was selling. ‘Take the tools,’ he told his son. ‘The table can go.’ The agent opened the passenger register and wrote the first family’s name."
 fh_coastal_migration.2.t: "Boats Before Dawn"
 fh_coastal_migration.2.d: "At first light the patrol found the [SCOPE.sState('fh_coastal_origin').GetName] landing empty: a cold cooking fire, a child’s shoe, a receipt for passage tucked under a stone. The sergeant read the [SCOPE.sState('fh_coastal_destination').GetName] name on the receipt, then watched the empty horizon. ‘Write ‘nothing found,’’ he told the clerk. The clerk wrote it slowly. The sergeant folded the receipt into his coat."
 fh_coastal_migration.a: "They have made their choice."

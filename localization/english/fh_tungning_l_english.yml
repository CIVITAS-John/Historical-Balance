 fh_tungning.1.t: "The Crown Across the Strait"
 fh_tungning.1.d: "The banners of the Great Qing fly from Beijing to the Fujian coast, but the Zheng court still holds Taiwan. Its merchants deal with Manila and Nagasaki, and its frigates guard the strait. The throne can keep its watch from Beijing, or you can take the helm of the kingdom across the water."
 fh_tungning.1.a: "Remain with the Great Qing"
 fh_tungning.1.b: "Play as the Kingdom of Tungning"
 fh_tungning.2.t: "The Crown Across the Strait"
 fh_tungning.2.d: "In 1662, Koxinga put his son Zheng Jing under house arrest and had Feng Xifan executed. Koxinga outlived the crisis long enough to lead an expedition to the Philippines. When he died the following year, neither side could force a victory. Chen Yonghua negotiated a withdrawal that brought more Chinese settlers to Taiwan. Their support helped Tungning hold Xiamen longer, gain ground during Wu Sangui's rebellion, and bring more people across the strait when the mainland foothold finally fell.\n\nWith Feng gone, Zheng Kezang inherited without a palace coup. He accepted the Catholic faith at Manila's urging, reviving a promise once made by the Yongli emperor. Spain backed the island court and kept a market for its porcelain, silk, and tea. Later rulers sought tribute from smaller courts to the south and opened trade with Japan. Tungning's ledgers tell of another route, through a warehouse in Busan that neither court likes to discuss in public.\n\nNow Spain's reach is shrinking, the Dutch and the East India Company dominate more of the sea trade, and Qing shipyards are catching up. The fleet that kept the kingdom independent is expensive to keep afloat. Zheng Wenhai inherits its debts as well as its flag."
 fh_tungning.2.a: "Keep the fleet afloat."

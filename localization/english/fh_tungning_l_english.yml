 fh_tungning.1.t: "The Island Missing from the Record"
 fh_tungning.1.d: "Kangxi sent a fleet to seize Taiwan. It returned without the island. Yongzheng had little appetite for a second expedition, and the defeat at Hetongpo put the matter to rest. Qianlong wanted Taiwan among his Ten Great Campaigns, but He Shen showed him what it would cost to supply an army across the strait. Before long, the minister had found a cheaper use for the Zheng: their merchants quietly sold Qing arsenals better firearms and introduced them to foreign gunsmiths. Those weapons served the emperor on other frontiers. Taiwan never made it into the record.\n\nJiaqing ordered He Shen's death in 1799, and the men who kept his accounts shut their doors. Daoguang has left the embargo in place. He has more urgent affairs than the Zheng, and his officials have orders to patrol the coast and leave the island alone. In Fujian, families with kin on both shores still cross when they can. A few have brought back the Catholic faith."
 fh_tungning.1.a: "Remain with the Great Qing"
 fh_tungning.1.b: "Play as the Kingdom of Tungning"
 fh_tungning.2.t: "The Crown Across the Strait"
 fh_tungning.2.d: "In 1662, Koxinga put his son Zheng Jing under house arrest and had Feng Xifan executed. Koxinga outlived the crisis long enough to lead an expedition to the Philippines. When he died the following year, neither side could force a victory. Chen Yonghua negotiated a withdrawal that brought more Chinese settlers to Taiwan. Their support helped Tungning hold Xiamen longer, gain ground during Wu Sangui's rebellion, and bring more people across the strait when the mainland foothold finally fell.\n\nWith Feng gone, Zheng Kezang inherited without a palace coup. He accepted the Catholic faith at Manila's urging, reviving a promise once made by the Yongli emperor. Spanish supplies helped hold off Kangxi's fleet, and Manila kept a market for Tungning's porcelain, silk, and tea. Later rulers sought tribute from smaller courts to the south and opened trade with Japan. Their ledgers tell of another route through a warehouse in Busan that neither court likes to discuss.\n\nOne set of books is missing. It recorded the firearms sold across the strait to He Shen, Qianlong's minister. The last entry dates to 1799, when news of his death reached Taiwan. Daoguang keeps the embargo in place, though fishing boats still carry letters between Fujian and Anping. Spain's reach is shrinking, and Dutch and Company merchants take more of the sea trade each year. The fleet that kept the kingdom independent is expensive to keep afloat. Zheng Wenhai inherits its debts as well as its flag."
 fh_tungning.2.a: "Keep the fleet afloat."
 fh_coastal_migration.1.t: "Passage Across the Sea"
 fh_coastal_migration.1.d: "Letters from [SCOPE.sState('fh_coastal_destination').GetName] are being read aloud at the docks of [SCOPE.sState('fh_coastal_origin').GetName]. They tell of work and rooms to let. The first families have booked passage, and more are making plans to follow."
 fh_coastal_migration.2.t: "Boats Before Dawn"
 fh_coastal_migration.2.d: "The coast patrols in [SCOPE.sState('fh_coastal_origin').GetName] found the landing empty at sunrise. By then, a group of families had already put to sea for [SCOPE.sState('fh_coastal_destination').GetName], with only what they could carry aboard."
 fh_coastal_migration.a: "They have made their choice."

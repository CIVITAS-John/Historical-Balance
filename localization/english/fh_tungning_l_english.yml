 law_fh_standardized_examinations: "Standardized Examinations"
 law_fh_standardized_examinations_desc: "Since the Han the examinations have been the one ladder a tenant's son could climb to a magistrate's chair, and the one ladder an emperor could burn. The questions are the same in every prefecture; so is the arithmetic of tutor fees. Examinees recite Confucius and are silent about Euclid."
 law_fh_yangban_administration: "Yangban Administration"
 law_fh_yangban_administration_desc: "The yangban hold their posts by descent, family registers, and the study of the rites, so that in the provinces a few surnames govern and a bright commoner's son is at best a clerk. Hereditary standing spares the court the expense of loyalty and saddles it with the sons it did not choose."

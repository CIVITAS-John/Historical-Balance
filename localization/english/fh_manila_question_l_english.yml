l_english:
 fh_je_manila_question: "The Manila Question"
 fh_je_manila_question_reason: "The Manila Compact was a bargain with Spain. If the Philippines breaks away, the court has eight years to settle who will rule Manila. It can offer protection while leaving Manila in charge of its own market, negotiate through ordinary diplomacy, or press its claims through a diplomatic play."
 fh_je_manila_question_status: "[ROOT.GetCountry.GetCustom('fh_manila_window_status')]\n\n[ROOT.GetCountry.GetCustom('fh_manila_submission_status')]\n[ROOT.GetCountry.GetCustom('fh_manila_conquest_status')][ROOT.GetCountry.GetCustom('fh_manila_expedition_status')]"
 fh_manila_waiting_for_independence: "The Philippines answers to [SCOPE.sCountry('fh_manila_phi').GetOverlord.GetName]. The eight-year window opens only when an independent Philippines owns Manila."
 fh_manila_deadline: "Deadline: #v [TimeKeeper.GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.GetCountry.MakeScope, 'fh_manila_window_timer') )]#!."
 fh_manila_open_status: "$fh_manila_deadline$"
 fh_manila_suspended_city: "$fh_manila_deadline$ Actions are suspended while the Philippines does not own Manila."
 fh_manila_suspended_subject: "$fh_manila_deadline$ Actions are suspended while the Philippines answers to [SCOPE.sCountry('fh_manila_phi').GetOverlord.GetName]."
 fh_manila_hold_status: "The deadline has passed. The court will await the result of the recorded conflict with the Philippines. New offers, plays, and preparations cannot extend the deadline."
 fh_manila_hold_suspended: "$fh_manila_hold_status$ Manila no longer meets the conditions for court actions."
 fh_manila_deadline_reached: "The deadline has passed. The court is reviewing the outcome."
 fh_manila_submission_pending: "#b Submission:#! Manila is considering the charter, which lets it keep its own market."
 fh_manila_submission_held: "#b Submission:#! The Philippines owns Manila and answers directly to the court."
 fh_manila_submission_needed: "#b Submission:#! Become the direct overlord of the Philippines while it owns Manila."
 fh_manila_conquest_unrecorded: "#b Direct rule:#! The court will record the Philippine provinces in Luzon and the Visayas when the window opens."
 fh_manila_conquest_count: "#b Direct rule:#! [ROOT.GetCountry.MakeScope.ScriptValue('fh_manila_provinces_held')|0] of [ROOT.GetCountry.MakeScope.ScriptValue('fh_manila_provinces_recorded')|0] recorded provinces held. A strict majority is required.\n[ROOT.GetCountry.GetCustom('fh_manila_city_status')] [ROOT.GetCountry.GetCustom('fh_manila_cebu_status')] [ROOT.GetCountry.GetCustom('fh_manila_territory_status')]"
 fh_manila_city_owned: "Manila is held."
 fh_manila_city_needed: "Manila must be held directly."
 fh_manila_cebu_unrequired: ""
 fh_manila_cebu_owned: "Cebu is held."
 fh_manila_cebu_needed: "Cebu must be held directly."
 fh_manila_enforcement_recorded: "A territorial demand has been enforced."
 fh_manila_enforcement_needed: "A territorial demand must be enforced in a play we started against the independent Philippines during the window."
 fh_manila_expedition_status_active: "\n$fh_manila_expedition_active_tt$"
 fh_manila_expedition_status_empty: ""
 fh_manila_agreement_header: "Manila Agrees to Protection"
 fh_manila_agreement_goal: "The Philippines enters our protection through a legal agreement while retaining Manila."
 fh_manila_agreement_conclusion: "Manila accepted the court's protection and kept its own government."
 fh_manila_enforced_header: "Manila Submits"
 fh_manila_enforced_goal: "Enforce subjugation in a qualifying diplomatic play while the Philippines retains Manila."
 fh_manila_enforced_conclusion: "Manila accepted the court as overlord under the terms of the enforced demand. Its government remains in place."
 fh_manila_conquest_header: "Direct Rule in Manila"
 fh_manila_conquest_goal: "Enforce a territorial demand in a qualifying play and directly own Manila, a majority of the recorded provinces, and Cebu if it was recorded."
 fh_manila_conquest_conclusion: "The court rules Manila directly and holds enough of Luzon and the Visayas to make the settlement stick."
 fh_manila_expired_header: "The Opportunity Passes"
 fh_manila_expired_goal: "The window expires without a settlement or a qualifying conflict still to be decided."
 fh_manila_expired_conclusion: "The court let the opportunity pass. Any lands the fleet secured will remain under our administration."
 fh_manila_settlement_agreement: "The Manila Settlement"
 fh_manila_settlement_agreement_desc: "A settlement brought Manila under the court's protection."
 fh_manila_settlement_enforced: "The Manila Settlement"
 fh_manila_settlement_enforced_desc: "The court imposed a settlement in Manila."
 fh_manila_missed_crossing: "A Missed Crossing"
 fh_manila_missed_crossing_desc: "The court's opportunity to settle the Manila Question has passed."

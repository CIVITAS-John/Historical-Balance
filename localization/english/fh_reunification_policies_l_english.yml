l_english:
 fh_reunification_taiwan_audience: "Taiwan’s Charter"
 fh_reunification_taiwan_audience_desc: "Choose a local assembly or appoint officials under the mainland system."
 fh_reunification_south_audience: "The Southern Compact"
 fh_reunification_south_audience_desc: "Set common policy for directly held southern states and their neighboring subject governments."
 fh_reunification_taiwan_question_available_tt: "Tungning directly owns ordinary land in Taiwan and has not settled its charter."
 fh_reunification_south_question_available_tt: "Tungning has an eligible southern state or direct subject. Holdings that are still covered by The Southern Passage or The Manila Question must wait."
 fh_reunification_taiwan_policy_decision: "Settle Taiwan’s Charter"
 fh_reunification_taiwan_policy_decision_desc: "The national settlement left the terms of Taiwan’s government open."
 fh_reunification_south_policy_decision: "Settle the Southern Compact"
 fh_reunification_south_policy_decision_desc: "The national settlement left the terms of the southern holdings open."
 fh_reunification_taiwan_open_policy_tt: "Open the audience on Taiwan’s Charter."
 fh_reunification_south_open_policy_tt: "Open the audience on the Southern Compact."
 fh_reunification_policies.1.t: "Taiwan’s Charter"
 fh_reunification_policies.1.d: "The School of Practical Learning has collected petitions from Siraya and settler schools. It asks for a local assembly to hear them. The Ming Estates argue that the island should be administered like the mainland.\n\n[ROOT.GetCountry.GetCustom('fh_reunification_policy_authority')]"
 fh_reunification_policies.2.t: "The Southern Compact"
 fh_reunification_policies.2.d: "The Maritime Houses want local courts and tribute concessions written into the settlement. The Ming Estates would rather appoint the officials who collect taxes in the southern states we rule directly.\n\n[ROOT.GetCountry.GetCustom('fh_reunification_policy_authority')]"
 fh_reunification_policy_assembly: "The deputies ask for both petitions to be read before the assembly votes."
 fh_reunification_policy_houses: "The Zheng First Minister speaks from the Maritime Houses’ benches. The cabinet must account for the terms it sends out under the Zhu seal."
 fh_reunification_policy_estates: "The Zheng First Minister presents the Estates’ case to the assembly. The appointments would be made under the Zhu seal."
 fh_reunification_policy_vacancy: "The office of First Minister is vacant. The petitions go before the sitting government under the Zhu charter."
 fh_reunification_policy_zheng: "The petitioners bring their accounts to the Zheng court, whose ships still depend on these ports."
 fh_reunification_policy_ministries: "The petitioners wait outside while the ministers compare their terms."
 fh_reunification_choose_taiwan_local: "Grant a local assembly"
 fh_reunification_choose_taiwan_local_tt: "While eligible, Taiwan gains #p +5 percentage points#! of Education Access and loses #n 10%#! Taxation Capacity."
 fh_reunification_choose_taiwan_central: "Appoint officials from the court"
 fh_reunification_choose_taiwan_central_tt: "For two years, the Ming Estates gain #p +2#! Approval and political movements create #n 15%#! more radicals in eligible Taiwan land."
 fh_reunification_choose_south_local: "Recognize the local courts"
 fh_reunification_choose_south_local_tt: "Eligible direct subjects pay #v half their usual tribute#! where applicable. Eligible directly owned southern states gain #p +5%#! Trade Advantage and lose #n 10%#! Taxation Capacity."
 fh_reunification_choose_south_central: "Send officers to the southern states"
 fh_reunification_choose_south_central_tt: "Eligible directly owned southern states gain #p +10%#! Taxation Capacity and political movements there create #n 15%#! more radicals for two years from first eligibility. Direct subjects retain their existing terms and tribute."
 fh_reunification_defer_policy: "Leave the current arrangements in place for now"
 fh_reunification_taiwan_local: "The Taiwan Assembly"
 fh_reunification_taiwan_central: "Appointed Taiwan Officials"
 fh_reunification_taiwan_examiners: "The Taiwan Appointments"
 fh_reunification_south_local: "The Southern Compact"
 fh_reunification_south_central: "Central Administration in the South"
 fh_reunification_south_tribute: "Southern Compact Tribute"

l_english:
 fh_mainland_mobilization: "Mobilization Across the Strait"
 fh_mainland_mobilization_desc: "The court calls in private capital to fit out the army and fleet for a crossing."
 fh_mainland_mobilization_support: "Backs Mainland Mobilization"
 fh_mainland_mobilization_protest: "Objects to Mainland Mobilization"
 fh_mainland_mobilization_officer_protest: "Would Rather Sail South"
 fh_mainland_war_never_fought: "A War Never Fought"
 fh_mainland_war_never_fought_desc: "The court proclaimed its return, then stood the fleet down without a campaign."
 fh_mainland_officer_disappointment: "An Expedition Dismissed"
 fh_mainland_war_defeat: "The Failed Crossing"
 fh_mainland_war_defeat_desc: "The first campaign against the mainland government ended in defeat."
 fh_mainland_mobilization_strategy: "Arm for the Mainland"
 fh_mainland_mobilization_strategy_desc: "[COUNTRY.GetName] is building barracks and provisioning an army for a mainland expedition."
 fh_mainland_mobilization.2.t: "A War Never Fought"
 fh_mainland_mobilization.2.d: "The quartermaster sells the biscuit and salt pork back to the chandlers for what they will pay and takes the receipt in his own hand. The captains watch from the godown steps and say nothing. No transport ever loaded. In the record room the clerk enters the year’s musters as “completed” and leaves the column for the crossing blank."
 fh_mainland_mobilization.2.a: "The treasury has already paid enough."
 fh_mainland_mobilization.3.t: "The Failed Crossing"
 fh_mainland_mobilization.3.d: "The man who kept the first campaign’s muster roll is set to reconcile it with the lists coming back. At the third company he stops: two men of the same name went out, and the return carries only one. He takes both village addresses down to the office where the notices are printed. The clerk there has already scraped the word ‘victory’ off the woodblock."
 fh_mainland_mobilization.3.a: "We will have to answer for this."

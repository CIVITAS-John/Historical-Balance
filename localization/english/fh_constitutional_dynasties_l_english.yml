 fh_constitution_appoint_first_minister_decision_desc: "The Zhu monarch presides at ceremonies and answers for the state before foreign envoys; a Zheng First Minister leads the government through the assembly.\n\n[GetPlayer.GetCustom('fh_constitution_ming_cabinet_status')]"
 fh_constitution_appoint_first_minister_decision_tooltip: "Seat a First Minister under the charter of the Southern Court."
 fh_constitution_ming_charter_active_tt: "A Zhu crown, or a regency for a Zhu heir, under a Monarchy with a voting law"
 fh_constitution_ming_minister_vacant_tt: "The office of First Minister is vacant"
 fh_constitution_ming_bloc_in_government_tt: "[GetPlayer.GetCustom('fh_constitution_ming_bloc_status')]"
 fh_constitution_ming_minister_appointed_tt: "Appoint a Zheng First Minister as leader of the qualifying bloc."
 fh_constitution_ming_bloc_estates: "The Ming Estates must sit in government before a First Minister can be seated."
 fh_constitution_ming_bloc_houses: "The Maritime Houses must sit in government before a First Minister can be seated."
 fh_constitution_ming_bloc_neither: "Neither the Ming Estates nor the Maritime Houses has the clout to seat a First Minister."

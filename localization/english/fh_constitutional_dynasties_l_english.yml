 fh_constitution_ming_rites_christian: "The Zhu house will keep the ancestral rites as dynastic ceremonies; the church need take no part, and the court will ask nothing of the priest."
 fh_constitution_ming_rites_deferred: "The charter leaves the ancestral rites to the court’s faith settlement."

l_english:
 fh_je_mainland_foothold: "The Return to the Mainland"
 fh_je_mainland_foothold_reason: "Secure all ordinary land in Fujian, Guangdong, or Zhejiang. The administration there must have two staffed levels of Government Administration, no occupation and at most 20% Turmoil at three consecutive monthly checks."
 fh_je_mainland_foothold_completed_desc: "The court has registered its first mainland administration. The Port and Village Registers no longer raise extra levies."
 fh_je_mainland_foothold_abandoned_desc: "The court has put aside its plans for establishing an administration on the mainland."
 fh_register_mainland_administration: "Register the Mainland Administration"
 fh_register_mainland_administration_desc: "Confirm how to record the first coastal administration. Completing the registration ends the extra levies raised under the Port and Village Registers."
 fh_port_and_village_levies_end_tt: "The Port and Village Registers lose their #v +25%#! conscription bonus."
 fh_mainland_registration_ready_tt: "At least one mainland region has met the registration requirements for three consecutive monthly checks."
 fh_mainland_registration.1.t: "Register the Mainland Administration"
 fh_mainland_registration.1.d: "The coastal administration is ready to submit its accounts. The court may recognize the local rolls or have its commissioners put them into a common format."
 fh_mainland_registration.1.a: "Enter the local rolls as they stand."
 fh_mainland_registration.1.b: "Require a common register."
 fh_mainland_registration.1.defer: "Defer registration."
 fh_mainland_administration_registers: "The Mainland Registers"

l_english:
 fh_je_mainland_foothold: "The Return to the Mainland"
 fh_je_mainland_foothold_reason: "A county does not enter the court’s books when its yamen falls, but when its rolls can be read.\n\nDirectly hold every ordinary parcel of Fujian, Guangdong, or Zhejiang and clear any occupation. Open the state panel and choose #b Incorporate State#!. Registration follows automatically at #v 50%#!. The journal map shows missing land, current owners, and the effect of staffing, Turmoil, and decrees. Set a policy through the usual decree interface.\n\n[ROOT.GetCountry.GetCustom('fh_mainland_progress_leader')]"
 fh_je_mainland_foothold_progress: "Incorporation: [JournalEntry.GetCountry.MakeScope.ScriptValue('fh_mainland_foothold_progress')|v1]% / #v 50%#!"
 fh_je_mainland_foothold_completed_desc: "The court has registered its first mainland administration: the land rolls are ruled, the magistrates are in their yamens, and the district's taxes arrive under a Tungning seal. If the Port and Village Registers are active, their #v +50%#! Conscription Rate ends permanently; their #v +10#! Acceptance in homelands remains."
 fh_je_mainland_foothold_abandoned_desc: "The court has set aside its plans for an administration on the mainland. The registers stay on the shelf, ruled and unsigned."
 fh_port_and_village_levies_end_tt: "The Port and Village Registers lose their #v +50%#! Conscription Rate bonus and keep their #v +10#! Acceptance in homelands."
 fh_mainland_registration_milestone: "Fujian, Guangdong, or Zhejiang is directly held, unoccupied, and at least #v 50%#! incorporated."
 fh_mainland_leader_fujian: "Leading eligible region: #b $STATE_FUJIAN$#!."
 fh_mainland_leader_guangdong: "Leading eligible region: #b $STATE_GUANGDONG$#!."
 fh_mainland_leader_zhejiang: "Leading eligible region: #b $STATE_ZHEJIANG$#!."
 fh_mainland_leader_none: "None of the three coastal regions is fully held and unoccupied."
 fh_foothold_map_treaty_port: "#b [THIS.GetState.GetName]#! is a treaty port and does not count towards registration."
 fh_foothold_map_missing: "#b [THIS.GetState.GetName]#!: ordinary land held by [THIS.GetState.GetOwner.GetName]."
 fh_foothold_map_leader: "#b Leading eligible region#!"
 fh_foothold_map_occupied: "#b [THIS.GetState.GetName]#!: occupation blocks registration."
 fh_foothold_map_incorporated: "#b [THIS.GetState.GetName]#! is fully incorporated."
 fh_foothold_map_project: "[SelectLocalization(THIS.GetState.IsIncorporating, 'fh_foothold_map_incorporating', 'fh_foothold_map_unstarted')]"
 fh_foothold_map_incorporating: "#b [THIS.GetState.GetName]#!: [THIS.GetState.GetIncorporationProgress|v%1] incorporated. The state panel shows the project."
 fh_foothold_map_unstarted: "#b [THIS.GetState.GetName]#!: choose #b Incorporate State#! in the state panel to begin."
 fh_mainland_registration.1.t: "The Mainland Registers"
 fh_mainland_registration.1.d: "The registers have been opened, and the first mainland district entered in the court’s own hand. From this audience on, the court adds its coastal administrations by incorporation. No further decision is needed; the clerks will bring the returns as each district ripens."
 fh_mainland_registration.1.defer: "Return to the state registers."
 fh_mainland_administration_registers: "The Mainland Registers"

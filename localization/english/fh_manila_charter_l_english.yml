l_english:
 fh_manila_offer_charter: "Offer the Manila Charter"
 fh_manila_offer_charter_desc: "Ask Manila to become Tungning’s tributary or protectorate and retain its own market."
 fh_manila_charter_unused_tt: "Tungning has yet to send its one charter offer."
 fh_manila_charter_window_tt: "The window is open, and the independent Philippines holds Manila."
 fh_manila_charter_peace_tt: "Both countries are at peace and on no opposing sides in a diplomatic play."
 fh_manila_charter_interest_tt: "Tungning has an active interest in Indonesia."
 fh_manila_charter_relations_tt: "Tungning has at least #p +30#! Relations with the Philippines."
 fh_manila_charter_market_tt: "The Philippines controls its own market."
 fh_manila_charter_agreement_tt: "A trade privileges or investment rights agreement is in force between the two countries."
 fh_manila_charter_subject_tt: "Tungning can take the Philippines as a Tributary or Protectorate under the normal rank, recognition, and subject rules."
 fh_manila_charter_offer_tt: "Manila has #bold 30 days#! to answer. If it accepts and the terms are still available, it becomes Tungning’s subject and keeps its own market."
 fh_manila_charter_market_terms_tt: "The Philippines keeps its own market through #bold Grant Own Market#!. Tungning cannot revoke the grant in the first year; revoking it later adds #n 25#! Liberty Desire."
 fh_manila_charter_ineligible_reply_tt: "#n The terms are no longer available. The charter will not take effect.#!"
 fh_manila_charter.1.t: "The Manila Charter"
 fh_manila_charter.1.tributary: "The envoys from Tungning ask Manila to send tribute. Their draft leaves the customs house and the market under our own authority. The clause is on the same sheet as the pledge of tribute, and their letter gives us thirty days to answer."
 fh_manila_charter.1.protectorate: "The envoys from Tungning offer the court’s protection. Manila would become a protectorate, but the draft leaves the customs house and the market under our own authority. Their letter gives us thirty days to answer."
 fh_manila_charter.1.accept: "Seal the charter."
 fh_manila_charter.1.refuse: "We will keep our independence."
 fh_manila_charter.3.t: "Manila’s Reply"
 fh_manila_charter.3.refused: "Manila has declined the charter. Its answer thanks the envoys for carrying the terms across the sea and makes no promises beyond the agreements already in force."
 fh_manila_charter.3.expired: "The thirty days have passed without an answer from Manila. The envoys close their register and leave the copy of the charter unsigned."
 fh_manila_charter.3.failed: "The charter could not take effect on the terms we sent. Our existing relations with Manila stand."
 fh_manila_charter.3.a: "File the charter."
 fh_manila_trade_treaty: "Manila Trade Agreement"
 fh_manila_open_commercial_talks: "Offer Trade Privileges"
 fh_manila_open_commercial_talks_action_name: "Offer Trade Privileges"
 fh_manila_open_commercial_talks_action_propose_name: "Offer Trade Privileges"
 fh_manila_open_commercial_talks_desc: "Offer the Philippines trade privileges in a treaty binding for two years."
 fh_manila_open_commercial_talks_tt: "If the treaty can still be signed, Tungning grants the Philippines trade privileges under a two-year binding period."
 fh_manila_open_commercial_talks_proposal_accepted_name: "[TARGET_COUNTRY.GetName] accepts trade privileges"
 fh_manila_open_commercial_talks_proposal_accepted_desc: "[TARGET_COUNTRY.GetName] has accepted our offer of trade privileges."
 fh_manila_open_commercial_talks_proposal_declined_name: "[TARGET_COUNTRY.GetName] declines trade privileges"
 fh_manila_open_commercial_talks_proposal_declined_desc: "[TARGET_COUNTRY.GetName] has declined our offer of trade privileges."
 fh_manila_open_commercial_talks_proposal_third_party_accepted_name: "$fh_manila_open_commercial_talks_proposal_accepted_name$"
 fh_manila_open_commercial_talks_proposal_third_party_accepted_desc: "[TARGET_COUNTRY.GetName] has accepted an offer of trade privileges from [INITIATOR_COUNTRY.GetName]."
 fh_manila_open_commercial_talks_proposal_third_party_declined_name: "$fh_manila_open_commercial_talks_proposal_declined_name$"
 fh_manila_open_commercial_talks_proposal_third_party_declined_desc: "[TARGET_COUNTRY.GetName] has declined an offer of trade privileges from [INITIATOR_COUNTRY.GetName]."
 fh_manila_open_commercial_talks_proposal_notification_name: "An offer of trade privileges"
 fh_manila_open_commercial_talks_proposal_notification_desc: "[INITIATOR_COUNTRY.GetName] offers us trade privileges in a treaty binding for two years."
 fh_manila_open_commercial_talks_proposal_notification_effects_desc: "$fh_manila_open_commercial_talks_tt$"

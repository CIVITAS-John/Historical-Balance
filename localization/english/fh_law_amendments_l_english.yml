l_english:
 amendment_fh_banner_precedence: "Banner Precedence"
 amendment_fh_banner_precedence_desc: "The Qing court reserves privileges and stipends for the Manchu banners, whose hereditary obligations take precedence over general conscription."
 amendment_fh_coastal_registers: "Coastal Registers"
 amendment_fh_coastal_registers_desc: "The court has relaxed restrictions on licensed trade through Canton while the Zheng court commands the other side of the strait."
 amendment_fh_port_and_village_registers: "Port and Village Registers"
 amendment_fh_port_and_village_registers_desc: "The court recognizes communities through their homes and harbors."
 amendment_fh_port_and_village_levies: "Port and Village Levies"
 amendment_fh_port_and_village_levies_desc: "Household rolls help the court muster recruits until it completes the return to the mainland."
 amendment_fh_yongli_articles: "Yongli Articles of Conscience"
 amendment_fh_yongli_articles_desc: "Invoking a promise made in the name of the Yongli court, these articles protect Catholic congregations and extend that shelter to other faiths."

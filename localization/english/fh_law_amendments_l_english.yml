l_english:
 amendment_fh_banner_precedence: "Banner Precedence"
 amendment_fh_banner_precedence_desc: "Qing reserves privilege, stipend and rank for the Manchu banners, whose hereditary duties of guard and garrison come before any general conscription. The provinces raise recruits; the banners collect the honor."
 amendment_fh_coastal_registers: "Coastal Registers"
 amendment_fh_coastal_registers_desc: "Canton's licensed trade is loosened while the Zheng court holds the far shore, and the hong merchants are permitted to learn how much of their old business survives a rival across the water."
 amendment_fh_port_and_village_registers: "Port and Village Registers"
 amendment_fh_port_and_village_registers_desc: "The court counts its people by hearth and harbor."
 amendment_fh_port_and_village_registers_with_levies: "$amendment_fh_port_and_village_registers$"
 amendment_fh_port_and_village_registers_with_levies_desc: "The court counts its people by hearth and harbor; the rolls also muster recruits until the first mainland administration is registered."
 amendment_fh_port_and_village_levies: "Port and Village Levies"
 amendment_fh_port_and_village_levies_desc: "Household rolls mustered for the tax collector serve the recruiting sergeant too, until the court completes its return to the mainland."
 amendment_fh_tungning_school_charter: "Tungning School Charter"
 amendment_fh_tungning_school_charter_desc: "Missions, temples, and academies teach under the court's protection, and no pupil is required to change his faith to attend. The priest, the monk and the examiner keep their own books and lend the state their pupils."
 amendment_fh_yongli_articles: "Yongli Articles of Conscience"
 amendment_fh_yongli_articles_desc: "Issued in the name of the Yongli court, these articles shelter Catholic congregations on the island and, by the same clause, every other faith that keeps the peace. The promise was made in a wrecked dynasty's name, and the court has never found a reason to break it."

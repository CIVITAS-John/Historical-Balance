l_english:
 fh_strait_treaty: "The Strait Accord"
 fh_strait_half_tribute: "Reduced Qing Tribute"
 fh_strait_half_tribute_desc: "The Strait Accord halves Tungning's ordinary payments to Qing while Tungning remains its direct tributary under the agreement."
 fh_strait_qing_available_tt: "Qing exists, is an unrecognized regional or major power, and is at peace with Tungning."
 fh_strait_tributary_available_tt: "Qing can take independent Tungning as a tributary, or Tungning is already its direct tributary."
 fh_strait_trade_laws_tt: "Neither country has closed its markets under full Isolationism. The Canton System permits the article."
 fh_strait_trade_markets_tt: "The two countries have separate markets, or Qing can grant its tributary a separate market."
 fh_strait_trade_article_tt: "Both countries have International Relations, or Qing already grants Tungning equivalent trade privileges."
 fh_strait_accord.1.t: "An Offer Across the Strait"
 fh_strait_accord.1.d: "Tungning's envoys offer to put aside their court's claim to the Ming mandate. In exchange, they ask for the terms of a tributary, a lighter payment, and access to our merchants. Their sealed instructions give us ninety days to answer."
 fh_strait_accord.1.accept: "Agree to the terms."
 fh_strait_accord.1.refuse: "Send the envoys home."
 fh_strait_accord_terms_tt: "If the full agreement can still be ratified, Tungning becomes or remains a direct Qing tributary at half the normal tribute. Qing grants five years of trade privileges or continues an equivalent article, ends its embargo, and raises relations to at least #p +30#!. Taiwan and Tungning's other lands and subjects stay under its rule; Qing keeps its claim to Taiwan."
 fh_strait_accord_refuse_tt: "Tungning will renounce the mainland claim. Existing treaties and relations stand."
 fh_strait_accord.3.t: "The Strait Accord"
 fh_strait_accord.3.ratified: "The seals are set. Taiwan's merchants may again bargain across the strait. The court will send tribute to Qing, but at the reduced rate recorded in the new accord."
 fh_strait_accord.3.refused: "The envoys return from Qing without a seal. The court has renounced its claim, and the existing terms between the two shores still stand."
 fh_strait_accord.3.expired: "Ninety days passed without an answer from Qing. The envoys close their books. The court has renounced its claim without a new agreement."
 fh_strait_accord.3.ineligible: "There is no Qing court able to take us as a tributary on these terms. The renunciation stands, with no diplomatic concessions on either side."
 fh_strait_accord.3.trade_blocked: "The trade article cannot take effect under the current laws or market arrangements. The court renounces its claim without signing the other terms."
 fh_strait_accord.3.rolled_back: "The negotiators could not put every term into effect. The trade and tribute concessions have been withdrawn. Tungning's renunciation stands."
 fh_strait_accord.3.a: "Enter the result in the court record."
 fh_strait_accord_ratified_aftermath_tt: "Tungning receives #bold The Strait Settlement#! for five years: #p +10%#! Influence and #p +10%#! Trade Advantage. Radicals among backers of accommodation fall by #p 10%#!; radicals among backers of the claim rise by #n 2%#!."
 fh_strait_accord_unanswered_aftermath_tt: "Tungning receives #bold An Unanswered Accord#! for two years: #n −10%#! Influence. Radicals among backers of accommodation rise by #n 10%#!."

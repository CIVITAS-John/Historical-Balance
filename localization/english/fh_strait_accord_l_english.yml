l_english:
 fh_strait_treaty: "The Strait Accord"
 fh_strait_half_tribute: "Reduced Qing Tribute"
 fh_strait_half_tribute_desc: "The accord halves Tungning’s ordinary payments while it remains Qing’s direct tributary."
 fh_strait_qing_available_tt: "Qing exists, is an unrecognized regional or major power, and is at peace with Tungning."
 fh_strait_tributary_available_tt: "Qing can take independent Tungning as a tributary, or Tungning is already its direct tributary."
 fh_strait_trade_laws_tt: "Neither country has closed its markets under full Isolationism; the Canton System permits the article."
 fh_strait_trade_markets_tt: "The two countries have separate markets, or Qing can grant its tributary a separate market."
 fh_strait_trade_article_tt: "Both countries have International Relations, or Qing already grants Tungning equivalent trade privileges."
 fh_strait_accord.1.t: "An Offer Across the Strait"
 fh_strait_accord.1.d: "The usher keeps the Tungning envoys in the outer court until their coats are dry, then brings them in with the letter in a plain box. Their spokesman asks for the terms of a direct tributary, at half the usual rate, and trading privileges for Tungning’s merchants. In return his court will give up its Ming claim. The board president reads to the last line, where the limit is written in their own hand: ninety days."
 fh_strait_accord.1.accept: "Agree to the terms."
 fh_strait_accord.1.refuse: "Send the envoys home."
 fh_strait_accord_terms_tt: "If ratifiable: direct Qing tributary at half tribute; 5 years of trade privileges (or equivalent existing terms); embargo lifted; at least #p +30#! Relations. Tungning keeps lands and subjects; Qing keeps its Taiwan claim."
 fh_strait_accord_refuse_tt: "Tungning will renounce the mainland claim. Existing treaties and relations stand."
 fh_strait_accord.3.t: "The Strait Accord"
 fh_strait_accord.3.ratified: "An Anping tea merchant wraps his Qing trading permit in oil paper and tucks it under his cargo book. The lighter alongside his junk is taking on tribute. Its tallyman checks the sum against the accord and calls back to the quay, ‘Half the usual rate? Is that all I’m to enter?’ The clerk shows him the line again. For the first time in years the merchant can tell his broker when to expect him."
 fh_strait_accord.3.refused: "The envoys come back on the next crossing with the letter still in its box and a receipt for the gifts. Their spokesman makes his report standing; no one has set a chair for him. Qing refused the terms. Tungning has renounced the claim anyway, and the old arrangements stand. A minister asks about the gifts. They were not returned."
 fh_strait_accord.3.expired: "On the ninetieth evening the clerk at the envoys’ lodging closes the shutters. No answer. At home the court has already entered the renunciation in its register. The clerk’s letter will go in the space left for Qing’s reply. He writes the date, looks once more at the empty street, and folds the page."
 fh_strait_accord.3.ineligible: "The junior envoy tries to add the addressee’s title to the fair copy. His superior stops him. No Qing authority can receive Tungning’s tribute on these terms. The junior waits with his brush in the air until the secretary calls for a different paper, the notice renouncing the claim. This one will need no address across the water."
 fh_strait_accord.3.trade_blocked: "The shipping clerk has ruled a fresh page for the clearances. The negotiator lays the trade article over it and says, ‘A signature won’t make this good at the quay.’ The clerk starts to ask where he should copy the tribute terms. The negotiator takes those pages away too. By evening the only notice ready for posting is the one withdrawing the claim."
 fh_strait_accord.3.rolled_back: "The accord makes it as far as the clerks who have to put it into force. It goes from one desk to the next and comes back with more notes in the margins than words on the page. The negotiator has the concessions struck from the register, one by one. The copyist’s knife stops at Tungning’s renunciation. That line requires no one else’s seal."
 fh_strait_accord.3.a: "Enter the result in the court record."
 fh_strait_accord_ratified_aftermath_tt: "#bold The Strait Settlement#! (5 years): #p +10%#! Influence and #p +10%#! Trade Advantage. Radicals: #p 10%#! fewer among accommodation backers; #n 2%#! more among claim backers."
 fh_strait_accord_unanswered_aftermath_tt: "#bold An Unanswered Accord#! (2 years): #n −10%#! Influence. Accommodation backers: #n 10%#! more Radicals."

l_english:
 fh_reunification_coastal_audience: "A Court on Two Shores"
 fh_reunification_coastal_audience_desc: "Confirm the sitting capital or review destinations on the Strait coast."
 fh_reunification_national_audience: "The National Seat"
 fh_reunification_national_audience_desc: "Confirm the sitting capital or review Nanjing and Beijing."
 fh_reunification_needs_seat_audience_tt: "The court has no confirmed seat and is not preparing a transfer."
 fh_reunification_needs_national_audience_tt: "Tungning must be independent, directly own a complete coastal region, and directly hold an unoccupied Nanjing or Beijing. No transfer can be in progress."
 fh_reunification_destination_owner_tt: "Directly own all ordinary land in the destination region. Treaty ports do not count."
 fh_reunification_destination_incorporated_tt: "The ordinary state must be fully incorporated."
 fh_reunification_destination_occupation_tt: "The ordinary state must be free of enemy occupation."
 fh_reunification_seats.1.t: "A Court on Two Shores"
 fh_reunification_seats.1.d: "Three packets of county returns arrive from Fujian, Guangdong and Zhejiang. A clerk ties them together and asks whether next month’s bundle should come to the same address. The admiral says the court can still command the strait from Taiwan. The new magistrates ask how long they should wait for an answer from across it.\n\n[ROOT.GetCountry.GetCustom('fh_reunification_seat_authority')]"
 fh_reunification_seats.2.t: "The National Seat"
 fh_reunification_seats.2.d: "The old capitals are on the agenda. The government may confirm its present seat or prepare to move the offices to Nanjing or Beijing.\n\n[ROOT.GetCountry.GetCustom('fh_reunification_seat_authority')]"
 fh_reunification_seat_assembly: "The speaker calls the assembly to order. Wherever the deputies meet, the provincial offices must be able to send their accounts there."
 fh_reunification_seat_cabinet: "First Minister [ROOT.GetCountry.MakeScope.Var('fh_constitution_first_minister').GetCharacter.GetFullName] lays the maps before the assembly. The Zhu seal will accompany the offices if the cabinet moves."
 fh_reunification_seat_vacancy: "The Zhu seal rests on the table. With the First Ministry vacant, the sitting ministers must present the estimates themselves."
 fh_reunification_seat_zheng: "The officers of the Zheng crown ask how long orders from each seat would take to reach the fleet at Anping."
 fh_reunification_seat_ministries: "The ministries have entered the cost of moving the registers beside the cost of keeping them where they are."
 fh_reunification_seats.4.t: "The Transfer of the Offices"
 fh_reunification_seats.4.d: "The last registers have arrived. The court now sits in [ROOT.GetCountry.GetCapital.GetName]. Ships and merchants still answer to the same market capital."
 fh_reunification_seats.5.t: "The Transfer Cancelled"
 fh_reunification_seats.5.d: "The approved move can no longer go ahead. The offices have stopped preparing their departure, and the court can consider a new seat."
 fh_reunification_keep_taiwan: "Keep the government in Taiwan"
 fh_reunification_keep_taiwan_tt: "Confirm Taiwan as the seat. For two years: #p +5%#! Ship Power Projection."
 fh_reunification_confirm_capital: "Confirm the sitting capital"
 fh_reunification_confirm_capital_tt: "Confirm the current seat without moving the court or gaining a bonus."
 fh_reunification_move_fujian: "Prepare to move to Fujian"
 fh_reunification_move_guangdong: "Prepare to move to Guangdong"
 fh_reunification_move_zhejiang: "Prepare to move to Zhejiang"
 fh_reunification_move_nanjing: "Prepare to move to Nanjing"
 fh_reunification_move_beijing: "Prepare to move to Beijing"
 fh_reunification_move_capital_tt: "Start six months of preparation: #n −5%#! national Bureaucracy output. On arrival, if no seat reward has been granted, the new seat gains #p +10%#! Taxation Capacity for two years. The market capital stays where it is."
 fh_reunification_defer_seat: "Keep the question open"
 fh_reunification_arrival_reward_tt: "The new seat gains #p +10%#! Taxation Capacity for two years while it remains eligible."
 fh_reunification_seat_arrived: "Open the offices."
 fh_reunification_seat_cancelled: "Set the preparations aside."
 fh_reunification_transfer_cost: "The Transfer of the Offices"
 fh_reunification_taiwan_fleet: "The Court Stays in Taiwan"
 fh_reunification_arrival_tax: "The Offices Reopen"

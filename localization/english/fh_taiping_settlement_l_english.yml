l_english:
 fh_taiping_trade_treaty_name: "The Strait Bargain"
 fh_taiping_cession_treaty_name: "Settlement of the Strait Bargain"
 fh_taiping_cession_honor_tt: "Cede only signed ordinary holdings that we own and can legally transfer. Recheck the frontier as each state changes hands."
 fh_taiping_cession_refuse_tt: "Any earned transfer we can still legally make will be recorded as a breach."
 fh_taiping_settlement.1.t: "Collect the Promises"
 fh_taiping_settlement.1.d: "The rebellion has ended. [SCOPE.sCountry('fh_taiping_cession_recipient').GetName] has delivered enough aid to earn the cession provision, and its envoys have come to collect the land in the signed schedule. No treaty ports, capital lands or territory outside that schedule may pass under this accord."
 fh_taiping_settlement.1.a: "Honor the terms we can deliver."
 fh_taiping_settlement.1.b: "Let them come for it themselves."
 fh_taiping_settlement.4.t: "Two Courts, One China"
 fh_taiping_settlement.4.d: "The Qing court is gone. The Heavenly Kingdom and Tungning kept their own banners through the war, and neither can now speak for the other. The treaty closes the accounts of their common struggle and leaves the question of China to another day."
 fh_taiping_settlement.4.a: "The envoys may go home."
 fh_mainland_squadrons_stand_down: "Squadrons Stand Down"
 fh_mainland_squadrons_stand_down_desc: "The court can spend less on the forces it set aside for the mainland, and the dockyard contracts shrink back to a peacetime footing."
 fh_taiping_promises_broken: "Promises Broken"
 fh_taiping_promises_broken_desc: "Other courts remember what became of the promises made during the rebellion, and they quote them back to our envoys."
 fh_taiping_expanded_bargain_honored: "The Strait Bargain Honored"
 fh_taiping_expanded_bargain_honored_desc: "The army depots and river squadron earned a settlement on the southern mainland, and the maps have been redrawn to show it."
 fh_taiping_bargain_honored: "The Strait Bargain Honored"
 fh_taiping_bargain_honored_desc: "Both courts have delivered the benefits they promised, and the treaty stands as written."
 fh_taiping_bargain_in_part: "The Bargain in Part"
 fh_taiping_bargain_in_part_desc: "Some promises were kept, but the court did not receive everything it sought, and the accounts do not balance."
 fh_taiping_cost_of_intervention: "The Cost of Intervention"
 fh_taiping_cost_of_intervention_desc: "The court committed aid and received nothing in return but thanks."
 fh_taiping_opening_lost: "An Opening Lost"
 fh_taiping_opening_lost_desc: "The rebellion ended without a bargain that our court put into effect, and the chance to shape the mainland passed with it."

l_english:
 fh_je_reunification_of_china: "The Reunification of China"
 fh_je_reunification_of_china_reason: "Hold Fujian, Guangdong and Zhejiang directly, and secure at least one of Nanjing and Beijing. Bring the rest of the mainland core under direct rule or obtain provincial charters. Use this journal’s map to inspect the current owners of disputed land. Offer terms through a provincial government’s diplomatic actions."
 fh_reunification_abandoned_desc: "The court has abandoned its claim to the mainland."
 fh_reunification_chartered_header: "Proclaim a chartered union"
 fh_reunification_direct_header: "Proclaim a directly administered union"
 fh_reunification_chartered_desc: "#bold The Reunification Settlement#! grants #positive_value +20#! Prestige and #positive_value +10#! Base Legitimacy for #bold 5 years#!. Existing radicals among Ming Estates supporters fall by 5%."
 fh_reunification_direct_desc: "#bold The Reunification Settlement#! grants #positive_value +25#! Prestige and #positive_value +10#! Base Legitimacy for #bold 7 years#!. Existing radicals among School of Practical Learning supporters fall by 5%; radicals among Ming Estates supporters rise by 2%."
 fh_reunification_chartered_settlement: "The Reunification Settlement"
 fh_reunification_direct_settlement: "The Reunification Settlement"
 fh_proclaim_reunification: "Proclaim the Reunification"
 fh_proclaim_reunification_desc: "Review the settlement and proclaim the union once the map, capital and local policies are settled."
 fh_reunification_outcomes_tt: "Open an audience to confirm the settlement. If any required land counts through a provincial charter, the union is chartered."
 fh_reunification_coast_tt: "Directly owns all ordinary land in Fujian, Guangdong and Zhejiang, free of enemy occupation"
 fh_reunification_seat_tt: "Directly owns all ordinary land in Nanjing or Beijing, free of enemy occupation"
 fh_reunification_core_tt: "Every other mainland core region is held directly or by loyal direct subjects with ratified provincial charters"
 fh_reunification_capital_tt: "The eligible political capital is confirmed and no transfer is underway"
 fh_reunification_policies_tt: "The court has chosen all available Taiwan and southern policies"
 fh_reunification_taiping_tt: "No Taiping pact awaits peace or a cession reply"
 fh_reunification_map_owner_tt: "[THIS.GetState.GetName] — [THIS.GetState.GetOwner.GetName]"
 fh_reunification_map_port_tt: "Treaty-port enclave; exempt from the ownership checklist."
 fh_reunification_map_complete_tt: "All ordinary land in this region counts toward the map checklist."
 fh_reunification_map_incomplete_tt: "The region is incomplete. Check each owner for outstanding ordinary land."
 fh_reunification_map_coast_tt: "Ordinary coastal land must be held directly by Tungning."
 fh_reunification_map_charter_tt: "This land counts under a ratified provincial charter."
 fh_reunification_map_charter_suspended_tt: "This charter does not count. The government must be a loyal direct subject with less than 50 Liberty Desire and no active independence play."
 fh_reunification_map_associate_tt: "An associate government remains independent. Its land does not count."
 fh_reunification_map_occupied_tt: "Ordinary land here is under enemy occupation. The court needs a secure coast and at least one secure inland seat."
 fh_provincial_charter_tribute: "Provincial Charter"
 fh_associate_government: "Recognize Associate Government"
 fh_associate_government_action_name: "$fh_associate_government$"
 fh_associate_government_desc: "Offer recognition as an independent associate. Its land will not count toward reunification."
 fh_associate_government_offer_tt: "Invite this government to become an independent associate."
 fh_provincial_charter: "Offer Provincial Charter"
 fh_provincial_charter_action_name: "$fh_provincial_charter$"
 fh_provincial_charter_desc: "Ask a direct subject to ratify a charter or offer a charter and a legal subject relationship to an independent provincial government."
 fh_provincial_charter_offer_tt: "Offer a provincial charter. Its government keeps its offices and pays half the usual tribute where applicable."
 fh_integrate_province: "Request Provincial Integration"
 fh_integrate_province_action_name: "$fh_integrate_province$"
 fh_integrate_province_desc: "Invite a loyal chartered province to join Tungning under direct administration. The request can be made once, after three years."
 fh_integrate_province_offer_tt: "Send the one-time invitation. If accepted, the subject is annexed and its land follows normal incorporation rules."
 fh_provincial_access_tt: "Tungning is independent, controls at least one complete coastal region, and is not awaiting a decision at the Taiping fork"
 fh_provincial_association_eligible_tt: "The recipient is an independent Chinese provincial government with ordinary core land, at peace with Tungning and not yet an associate"
 fh_provincial_charter_eligible_tt: "The recipient is a Chinese provincial government with ordinary core land and no charter. It must be a loyal direct subject or eligible to become a tributary or protectorate by agreement while both sides are at peace"
 fh_provincial_integration_eligible_tt: "Both countries are at peace, the charter has been in force for three years, the subject remains loyal, and it has never received an integration request"
 fh_provincial_no_pending_offer_tt: "The government is not considering another offer and has not rejected one in the last year"
 fh_reunification_events.2.t: "Terms from Tungning"
 fh_reunification_events.2.association: "The court at Tungning proposes to recognize our government as an associate. We would remain independent, and neither side would be bound to take the negotiations further."
 fh_reunification_events.2.charter: "The court at Tungning offers a charter. As its direct subject, we would keep our offices and garrisons, pay half the usual tribute where applicable, and count our lands toward the union once our Liberty Desire is below 50 and we are not seeking independence."
 fh_reunification_events.2.integration: "The court asks us to join the union under direct administration. Accepting ends our separate government and transfers our lands to Tungning."
 fh_reunification_events.2.a: "Accept the terms"
 fh_reunification_events.2.b: "Decline"
 fh_reunification_events.3.t: "No Agreement Reached"
 fh_reunification_events.3.d: "[SCOPE.sCountry('fh_provincial_reply_country').GetName] did not accept our offer. Its current terms remain in force."
 fh_reunification_events.3.a: "We will continue under the present terms."
 fh_reunification_events.4.t: "The Reunification of China"
 fh_reunification_events.4.d: "The court has the lands and agreements it needs to proclaim the settlement. The union will keep Tungning’s government and its current political capital."
 fh_reunification_events.4.a: "Proclaim the settlement"
 fh_reunification_events.4.b: "Wait"
 fh_associate_government_action_notification_name: "Offer of Association"
 fh_associate_government_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has offered to recognize us as an independent associate."
 fh_provincial_charter_action_notification_name: "Offer of a Provincial Charter"
 fh_provincial_charter_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has offered us a provincial charter."
 fh_integrate_province_action_notification_name: "Invitation to Integrate"
 fh_integrate_province_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has asked us to join the union under direct administration."

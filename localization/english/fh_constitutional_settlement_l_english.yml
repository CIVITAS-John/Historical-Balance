l_english:
 fh_je_constitutional_settlement: "Who Shall Rule the Eastern Sea?"
 fh_je_constitutional_settlement_reason: "The claim across the strait is settled, and the court must decide whose mandate it will recognize. Each mandate can reach 200; ratification opens a separate journal to put the settlement into practice. The rival claims cost us 5 Legitimacy until we ratify.\n\nMonthly change: Republic [ROOT.GetCountry.MakeScope.ScriptValue('fh_constitution_republic_drift')|+0], Ming [ROOT.GetCountry.MakeScope.ScriptValue('fh_constitution_ming_drift')|+0], Zheng [ROOT.GetCountry.MakeScope.ScriptValue('fh_constitution_zheng_drift')|+0].\n[ROOT.GetCountry.GetCustom('fh_constitution_ming_limit_status')]\n\n#b Republic:#! Radical or Reformer leaders in the governing School or Trade Unions, and a broad franchise, build its mandate. Autocracy weakens it.\n#b Ming:#! Traditionalist or Royalist leaders in government, directly held mainland regions, and the court’s approach to the rites shape its mandate. Subjecthood and the loss or occupation of Taiwan weaken it.\n#b Zheng:#! A legitimate monarchy, the Army and Fleet in government, and control of Manila or the secured southern grants build its mandate. A republic weakens it."
 fh_constitution_republic_bar: "Republican Mandate"
 fh_constitution_ming_bar: "Ming Mandate"
 fh_constitution_zheng_bar: "Zheng Mandate"
 fh_constitution_debate_status: "The court is still building a mandate."
 fh_constitution_choose_tone_status: "The court awaits a decision on how to ratify the selected mandate."
 fh_constitution_recommend_republic_status: "Recommended: Ratify the Republic."
 fh_constitution_recommend_ming_status: "Recommended: Ratify the Ming Mandate."
 fh_constitution_recommend_zheng_status: "Recommended: Ratify the Zheng Mandate."
 fh_constitution_ming_permanent_lock: "Renunciation permanently locks the Ming mandate at zero."
 fh_constitution_ming_temporary_cap: "The Ming mandate is capped at 150. It needs independence, direct and unoccupied Taiwan, and a mainland foothold. The invitation lists which requirements are missing."
 fh_constitution_ming_has_no_cap: "The court meets the territorial and independence requirements for the Ming mandate."
 fh_constitution_ming_unlocked_tt: "Tungning reasserted its Ming claim"
 fh_constitution_taiwan_tt: "Directly hold ordinary Taiwan without enemy occupation"
 fh_constitution_foothold_tt: "Directly hold ordinary Fujian, Guangdong, or Zhejiang"
 fh_constitution_civic_sponsor_tt: "The School of Practical Learning or Trade Unions are in government"
 fh_constitution_zhu_sponsor_tt: "The Ming Estates or Ritual Academies are in government"
 fh_constitution_zheng_sponsor_tt: "The Army and Fleet or Ming Estates are in government"
 fh_constitution_endorsement_cooldown_tt: "No mandate has been endorsed in the past six months"
 fh_constitution_endorsement_effect_tt: "Raise this mandate by 12 and lower each rival by 5, within their current limits. For six months, give the sponsor +2 Approval and the opposing group −2 Approval."
 fh_constitution_ratification_pending_tt: "No ratification audience is open"
 fh_constitution_threshold_tt: "The mandate has reached 200"
 fh_constitution_civic_congress: "Convene a Civic Congress"
 fh_constitution_civic_congress_desc: "The School of Practical Learning or the Trade Unions can make the case for examinations and public schools under an elected government. The Ming Estates will oppose them."
 fh_constitution_invite_zhu: "Invite the Zhu Court"
 fh_constitution_invite_zhu_desc: "Promise to recognize the estates, titles, and public rites of the Zhu court. The Ming Estates or Ritual Academies may sponsor the invitation. The Maritime Houses will oppose it."
 fh_constitution_zheng_petition: "Petition for a Zheng Mandate"
 fh_constitution_zheng_petition_desc: "The Army and Fleet or Ming Estates can petition to recognize the Zheng house in its own right. The School of Practical Learning will oppose the petition."
 fh_constitution_ratify_republic: "Ratify the Republic"
 fh_constitution_ratify_republic_desc: "Negotiate a compact or proclaim the republican mandate. The Taiwan Convention will then rely on ordinary lawmaking to establish an elected government."
 fh_constitution_ratify_ming: "Ratify the Ming Mandate"
 fh_constitution_ratify_ming_desc: "Negotiate a compact or proclaim the constitutional restoration. The Southern Court Reborn will prepare the Zhu crown and a Zheng cabinet."
 fh_constitution_ratify_zheng: "Ratify the Zheng Mandate"
 fh_constitution_ratify_zheng_desc: "Negotiate a compact or proclaim the Zheng mandate. A Mandate of Our Own will prepare the administration and confirm the dynasty."
 fh_constitution_republic_ratified: "The Republic Ratified"
 fh_constitution_republic_ratified_desc: "The delegates have recognized the republican mandate. The Taiwan Convention will now work to establish its government."
 fh_constitution_ming_ratified: "The Ming Mandate Ratified"
 fh_constitution_ming_ratified_desc: "The court recognizes a Zhu crown under a constitutional charter. The cabinet and succession must now be established."
 fh_constitution_zheng_ratified: "The Zheng Mandate Ratified"
 fh_constitution_zheng_ratified_desc: "The court has recognized the Zheng house's mandate in its own right. The crown and the administration must now be secured."
 fh_constitution_debate_penalty: "Rival Mandates"
 fh_constitution_endorsement_approval: "Sponsored a Mandate"
 fh_constitution_endorsement_disapproval: "Opposes an Endorsement"
 fh_constitution_petition_approval: "Petition Heard"
 fh_constitution_petition_disapproval: "Petition Rejected"
 fh_constitution_mandate_ratified: "A Mandate Ratified"
 fh_constitution_convention_confidence: "The Convention’s Confidence"
 fh_constitution_southern_court_reborn: "The Southern Court Reborn"
 fh_constitution_mandate_of_our_own: "A Mandate of Our Own"
 fh_constitution_compact: "Settle the mandate by a negotiated compact."
 fh_constitution_compact_tt: "Gain +10% Influence for two years. Remove 2% Radicals among School of Practical Learning, Ming Estates, and Army and Fleet supporters."
 fh_constitution_proclamation: "Proclaim our mandate decisively."
 fh_constitution_proclamation_tt: "Gain +10% Influence for four years. Remove 5% Radicals among supporters of the winning mandate and add 2% among supporters of each rival. The three groups are the School of Practical Learning, Ming Estates, and Army and Fleet, respectively."
 fh_constitution_defer: "Continue the debate."
 fh_constitution.1.t: "The Republic Put to the Court"
 fh_constitution.1.d: "The civic delegates have laid their draft before the court. They can secure the old houses' cooperation by negotiation or call publicly for elections and an end to inherited rule."
 fh_constitution.2.t: "A Charter for the Zhu Crown"
 fh_constitution.2.d: "The Zhu envoys have accepted a crown under a charter. A Zhu monarch would preside at ceremonies and represent the state; a Zheng First Minister would lead the cabinet. The court must now decide how to ratify that bargain."
 fh_constitution.3.t: "The Zheng Mandate Put to the Court"
 fh_constitution.3.d: "The dynasty's petitioners say that generations of governing the island and defending its ports have earned the Zheng a mandate in their own right. The court weighs a compact with the other houses against a public proclamation."
 fh_constitution.4.t: "A Crown and a Cabinet"
 fh_constitution.4.d: "The Zhu monarch takes the throne under the charter, with a Zheng First Minister to direct the cabinet through the assembly. [ROOT.GetCountry.GetCustom('fh_constitution_ming_rites')]"
 fh_constitution_charter_signed: "Let the charter govern the court."
 fh_constitution.5.t: "The Rites of the Charter"
 fh_constitution.5.d: "The faith settlement has answered a question the charter left open. [ROOT.GetCountry.GetCustom('fh_constitution_ming_rites')]"
 fh_constitution_rites_acknowledged: "Enter it in the court record."
 fh_constitution.11.t: "Civic Delegates at the Gate"
 fh_constitution.11.d: "Delegates ask the court to consider a government responsible to voters. Their petition links public schools and the examinations to a broader franchise."
 fh_constitution.12.t: "A Petition from the Zhu Envoys"
 fh_constitution.12.d: "Envoys offer to recognize the assembly's place in government if the court recognizes the Zhu house and its ceremonies."
 fh_constitution.13.t: "The Officers Petition the Court"
 fh_constitution.13.d: "Officers from the Army and Fleet ask the court to recognize the Zheng house. They cite the dynasty's service to the island and the men who defend it."
 fh_constitution.14.t: "A Petition from the Southern Ports"
 fh_constitution.14.d: "Merchants from the southern ports ask the court to recognize the house whose ships and treaties opened their passage."
 fh_constitution_petition_back: "Hear the petitioners."
 fh_constitution_petition_back_tt: "Raise the petition’s mandate by 5, up to its current limit, and give its sponsoring group +1 Approval for six months."
 fh_constitution_petition_reject: "Reject the petition."
 fh_constitution_petition_reject_tt: "Lower the petition’s mandate by 5 and give its sponsoring group −1 Approval for six months."
 fh_constitution_streak_tt: "All settlement requirements have held for six consecutive months"
 fh_constitution_streak_active_status: "The requirements are met. Maintain them for six consecutive months."
 fh_constitution_republic_paused_status: "The Convention is waiting for a republic, a qualifying voting law, and at least 60 Legitimacy."
 fh_constitution_ming_paused_status: "The charter is waiting for the court to meet its founding requirements."
 fh_constitution_zheng_waiting_for_heir_status: "A Zheng heir is in line. The settlement waits for the succession."
 fh_constitution_zheng_paused_status: "The mandate is waiting for a Zheng monarch, a qualifying bureaucracy, three levels of Government Administration in Taiwan, and at least 60 Legitimacy."
 fh_je_taiwan_convention: "The Taiwan Convention"
 fh_je_taiwan_convention_reason: "Put the republican mandate into practice. Enact a Parliamentary or Presidential Republic, adopt Wealth Voting, Census Voting, or Universal Suffrage, and keep Legitimacy at 60 or higher for six consecutive months."
 fh_constitution_taiwan_convention_completed_desc: "The elected government has held long enough for the Convention to conclude its work."
 fh_constitution_taiwan_convention_aftermath_tt: "Gain +10 Legitimacy for five years. Remove 5% Radicals among School of Practical Learning supporters and add 2% among Ming Estates supporters."
 fh_je_southern_court_reborn: "The Southern Court Reborn"
 fh_je_southern_court_reborn_reason: "For six consecutive months, maintain independence, Monarchy with Landed Voting or a broader franchise, at least 60 Legitimacy, direct and unoccupied Taiwan, and a mainland foothold. The stronger eligible bloc must be in government.\n\n[ROOT.GetCountry.GetCustom('fh_constitution_ming_bloc_status')]"
 fh_constitution_southern_court_reborn_completed_desc: "The Zhu monarch presides under the charter and the Zheng First Minister leads the cabinet."
 fh_constitution_southern_court_reborn_aftermath_tt: "Gain +20 Prestige for five years. Remove 5% Radicals among Ming Estates supporters and among the First Minister’s bloc if that bloc is the Maritime Houses."
 fh_je_mandate_of_our_own: "A Mandate of Our Own"
 fh_je_mandate_of_our_own_reason: "For six consecutive months, keep a living Zheng monarch on the throne, use Appointed or Elected Bureaucrats, maintain at least three levels of Government Administration in Tungning’s Taiwan, and keep Legitimacy at 60 or higher. If another house reigns and a Zheng is heir, wait for the succession."
 fh_constitution_mandate_of_our_own_completed_desc: "The Zheng crown now stands on its own mandate, and Taiwan has an administration to sustain it."
 fh_constitution_mandate_of_our_own_aftermath_tt: "Gain +10 Legitimacy and +10% Bureaucracy for five years. Remove 5% Radicals among Army and Fleet supporters and add 2% among School of Practical Learning supporters."
 fh_constitution_offer_zheng_cadet: "Name a Zheng Cadet"
 fh_constitution_offer_zheng_cadet_desc: "If no Zheng already reigns or stands in the line of succession, name a Zheng cadet as heir once. The reigning monarch keeps the throne."

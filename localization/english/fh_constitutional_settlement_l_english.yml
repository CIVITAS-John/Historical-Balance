l_english:
 fh_je_constitutional_settlement: "Who Shall Rule the Eastern Sea?"
 fh_je_constitutional_settlement_reason: "The claim across the strait is settled; the court must now say whose mandate it recognizes. Each mandate can reach 200, and ratification opens a separate journal to put the settlement into practice. The rival claims cost us 5 Legitimacy until we ratify.\n\nMonthly change: Republic [ROOT.GetCountry.MakeScope.ScriptValue('fh_constitution_republic_drift')|+0], Ming [ROOT.GetCountry.MakeScope.ScriptValue('fh_constitution_ming_drift')|+0], Zheng [ROOT.GetCountry.MakeScope.ScriptValue('fh_constitution_zheng_drift')|+0].\n[ROOT.GetCountry.GetCustom('fh_constitution_ming_limit_status')]\n\n#b Republic:#! Radical or Reformer leaders in the governing School or Trade Unions, with a broad franchise, build its mandate; autocracy weakens it.\n#b Ming:#! Traditionalist or Royalist ministers, directly held mainland regions, and the court’s approach to the rites build its mandate; subjecthood, and the loss or occupation of Taiwan, weaken it.\n#b Zheng:#! A legitimate monarchy, the Army and Fleet in government, and Manila or the secured southern grants build its mandate; a republic weakens it."
 fh_constitution_republic_bar: "Republican Mandate"
 fh_constitution_ming_bar: "Ming Mandate"
 fh_constitution_zheng_bar: "Zheng Mandate"
 fh_constitution_debate_status: "The court is still building a mandate."
 fh_constitution_choose_tone_status: "The court awaits a decision on how to ratify the selected mandate."
 fh_constitution_recommend_republic_status: "Recommended: Ratify the Republic."
 fh_constitution_recommend_ming_status: "Recommended: Ratify the Ming Mandate."
 fh_constitution_recommend_zheng_status: "Recommended: Ratify the Zheng Mandate."
 fh_constitution_ming_permanent_lock: "Renunciation locks the Ming mandate at zero for good."
 fh_constitution_ming_temporary_cap: "Ming is capped at 150. It needs independence, direct and unoccupied Taiwan, and a mainland foothold; the invitation lists what is missing."
 fh_constitution_ming_has_no_cap: "The court meets the territorial and independence requirements for Ming."
 fh_constitution_ming_unlocked_tt: "Tungning reasserted its Ming claim"
 fh_constitution_taiwan_tt: "Directly hold ordinary Taiwan, free of enemy occupation"
 fh_constitution_foothold_tt: "Directly hold ordinary Fujian, Guangdong, or Zhejiang"
 fh_constitution_civic_sponsor_tt: "The School of Practical Learning or Trade Unions are in government"
 fh_constitution_zhu_sponsor_tt: "The Ming Estates or Ritual Academies are in government"
 fh_constitution_zheng_sponsor_tt: "The Army and Fleet or Ming Estates are in government"
 fh_constitution_endorsement_cooldown_tt: "No mandate endorsed in the past six months"
 fh_constitution_endorsement_effect_tt: "Mandates: +12 chosen, −5 each rival (within limits). Approval for six months: +2 sponsor, −2 opposing group."
 fh_constitution_ratification_pending_tt: "No ratification audience is open"
 fh_constitution_threshold_tt: "The mandate has reached 200"
 fh_constitution_civic_congress: "Convene a Civic Congress"
 fh_constitution_civic_congress_desc: "The School of Practical Learning or the Trade Unions can make the case for examinations and public schools under an elected government. The Ming Estates will oppose them."
 fh_constitution_invite_zhu: "Invite the Zhu Court"
 fh_constitution_invite_zhu_desc: "Promise to recognize the estates, titles, and public rites of the Zhu court; the Ming Estates or Ritual Academies may sponsor the invitation. The Maritime Houses will oppose it."
 fh_constitution_zheng_petition: "Petition for a Zheng Mandate"
 fh_constitution_zheng_petition_desc: "The Army and Fleet or Ming Estates may petition to recognize the Zheng house in its own right. The School of Practical Learning will oppose the petition."
 fh_constitution_ratify_republic: "Ratify the Republic"
 fh_constitution_ratify_republic_desc: "Negotiate a compact or proclaim the republican mandate. The Taiwan Convention will then rely on ordinary lawmaking to establish an elected government."
 fh_constitution_ratify_ming: "Ratify the Ming Mandate"
 fh_constitution_ratify_ming_desc: "Proclaim the constitutional restoration, by compact or decree. The Southern Court Reborn will prepare the Zhu crown and a Zheng cabinet."
 fh_constitution_ratify_zheng: "Ratify the Zheng Mandate"
 fh_constitution_ratify_zheng_desc: "Negotiate a compact or proclaim the Zheng mandate. A Mandate of Our Own will prepare the administration and confirm the dynasty."
 fh_constitution_republic_ratified: "The Republic Ratified"
 fh_constitution_republic_ratified_desc: "The delegates have recognized the republican mandate; the Taiwan Convention will now establish its government."
 fh_constitution_ming_ratified: "The Ming Mandate Ratified"
 fh_constitution_ming_ratified_desc: "The court recognizes a Zhu crown under a constitutional charter. The cabinet and succession must now be settled."
 fh_constitution_zheng_ratified: "The Zheng Mandate Ratified"
 fh_constitution_zheng_ratified_desc: "The court has recognized the Zheng house's mandate in its own right. The crown and the administration must now be secured."
 fh_constitution_debate_penalty: "Rival Mandates"
 fh_constitution_endorsement_approval: "Sponsored a Mandate"
 fh_constitution_endorsement_disapproval: "Opposes an Endorsement"
 fh_constitution_petition_approval: "Petition Heard"
 fh_constitution_petition_disapproval: "Petition Rejected"
 fh_constitution_mandate_ratified: "A Mandate Ratified"
 fh_constitution_convention_confidence: "The Convention’s Confidence"
 fh_constitution_southern_court_reborn: "The Southern Court Reborn"
 fh_constitution_mandate_of_our_own: "A Mandate of Our Own"
 fh_constitution_compact: "Settle the mandate by a negotiated compact."
 fh_constitution_compact_tt: "+10% Influence (2 years). −2% Radicals among supporters of the School of Practical Learning, Ming Estates, and Army and Fleet."
 fh_constitution_proclamation: "Proclaim our mandate decisively."
 fh_constitution_proclamation_tt: "+10% Influence (4 years). Radicals: −5% among the winning mandate’s supporters; +2% among each rival’s (School of Practical Learning, Ming Estates, Army and Fleet)."
 fh_constitution_defer: "Continue the debate."
 fh_constitution.1.t: "The Republic Put to the Court"
 fh_constitution.1.d: "The eldest delegate lays the fair copy on the table and squares its edges. ‘The government answers to voters,’ she says. ‘No seat passes from father to son.’ A tutor from the old houses asks whether the lists from the wards are a threat. ‘A reminder.’ She turns the draft around so he can read it."
 fh_constitution.2.t: "A Charter for the Zhu Crown"
 fh_constitution.2.d: "The Zhu envoy reads the clause about the throne, then the clause about the cabinet, and stops at the word ‘preside.’ A Zheng cousin at the back asks whether the cabinet will answer to the assembly or to the crown. The envoy says the charter names the assembly. Then he rolls it up and asks how the court means to swear to it."
 fh_constitution.3.t: "The Zheng Mandate Put to the Court"
 fh_constitution.3.d: "The officers read from a roll of the fleet’s dead, harbor by harbor. An inland magistrate asks how keeping ships afloat earns a dynasty the right to rule. The eldest captain turns a page and asks him to read the next three names. All three come from the magistrate’s own district. The clerk who has been drafting a proclamation for the Zheng stops to listen."
 fh_constitution.4.t: "A Crown and a Cabinet"
 fh_constitution.4.d: "On a wet morning the Zhu monarch takes the throne with the charter open on the table where the seal used to sit. The first question comes from a salt inspector; the Zheng First Minister rises to answer it, and the assembly lets him finish. [ROOT.GetCountry.GetCustom('fh_constitution_ming_rites')]"
 fh_constitution_charter_signed: "Let the charter govern the court."
 fh_constitution.5.t: "The Rites of the Charter"
 fh_constitution.5.d: "The recorders carry the faith settlement up from the audience hall and lay it beside the charter. The steward of the Zhu household reads the clause on rites twice, then asks for a copy before the next ceremony. A clerk lifts the paper by its corners. The ink is still wet. [ROOT.GetCountry.GetCustom('fh_constitution_ming_rites')]"
 fh_constitution_rites_acknowledged: "Enter it in the court record."
 fh_constitution.11.t: "Civic Delegates at the Gate"
 fh_constitution.11.d: "Chalk still on their cuffs, the delegates come up from the school with a bundle of petitions tied in string. The porter asks how many signatures. Four hundred and eleven, the youngest says, then corrects himself: one more came at the gate. The signers want public schools, a fair hearing for their children at the examinations, and a say in who governs. Some have signed with a thumbprint."
 fh_constitution.12.t: "A Petition from the Zhu Envoys"
 fh_constitution.12.d: "The Zhu envoys wait standing while a clerk clears a table for their register. It is a plain book in old yellow silk, and the eldest keeps one hand on the knot while he speaks. He offers the assembly its place in the government, and asks the same for his house and its ceremonies."
 fh_constitution.13.t: "The Officers Petition the Court"
 fh_constitution.13.d: "Salt from the parade ground still shows on their boots. Their spokesman is a ship’s master who has never addressed the court before; he reads from a paper his squadron has all marked with their thumbs. The fleet has kept the island since the Dutch left, he says. Then he asks the court to recognize the house that raised this fleet."
 fh_constitution.14.t: "A Petition from the Southern Ports"
 fh_constitution.14.d: "The merchants from the southern ports bring a bundle of clearances stamped at six anchorages and a jar of Borneo sago as a sample. Their speaker sets the jar where the court can read its painted label, and waits while the clerk counts the stamps. The house’s ships and treaties opened that passage, he says, and the men who paid for the wharves would like to know whose flag they are paying under."
 fh_constitution_petition_back: "Hear the petitioners."
 fh_constitution_petition_back_tt: "+5 to the petition’s mandate (up to its limit); +1 sponsor Approval for six months."
 fh_constitution_petition_reject: "Reject the petition."
 fh_constitution_petition_reject_tt: "−5 to the petition’s mandate; −1 sponsor Approval for six months."
 fh_constitution_streak_tt: "All requirements have held for six consecutive months"
 fh_constitution_streak_active_status: "The requirements are met. Keep them for six consecutive months."
 fh_constitution_republic_paused_status: "The Convention waits for a republic, a qualifying voting law, and 60 Legitimacy."
 fh_constitution_ming_paused_status: "The charter waits for the court to meet its founding requirements."
 fh_constitution_zheng_waiting_for_heir_status: "A Zheng heir is in line; the settlement waits for the succession."
 fh_constitution_zheng_paused_status: "The mandate waits for a Zheng monarch, a qualifying bureaucracy, three levels of Government Administration in Taiwan, and 60 Legitimacy."
 fh_je_taiwan_convention: "The Taiwan Convention"
 fh_je_taiwan_convention_reason: "Put the republican mandate into practice: enact a Parliamentary or Presidential Republic, adopt Wealth Voting, Census Voting, or Universal Suffrage, and hold 60 Legitimacy for six consecutive months."
 fh_constitution_taiwan_convention_completed_desc: "The elected government has held long enough for the Convention to finish its work."
 fh_constitution_taiwan_convention_aftermath_tt: "+10 Legitimacy (5 years). Radicals: −5% among School of Practical Learning supporters; +2% among Ming Estates supporters."
 fh_je_southern_court_reborn: "The Southern Court Reborn"
 fh_je_southern_court_reborn_reason: "For six consecutive months, maintain independence; Monarchy with Landed Voting or a broader franchise; 60 Legitimacy; direct, unoccupied Taiwan; and a mainland foothold. The stronger eligible bloc must be in government.\n\n[ROOT.GetCountry.GetCustom('fh_constitution_ming_bloc_status')]"
 fh_constitution_southern_court_reborn_completed_desc: "The Zhu monarch presides under the charter; the Zheng First Minister leads the cabinet."
 fh_constitution_southern_court_reborn_aftermath_tt: "+20 Prestige (5 years). −5% Radicals among Ming Estates supporters and, if they lead the cabinet, Maritime Houses supporters."
 fh_je_mandate_of_our_own: "A Mandate of Our Own"
 fh_je_mandate_of_our_own_reason: "For six consecutive months, keep a living Zheng monarch, use Appointed or Elected Bureaucrats, hold three levels of Government Administration in Tungning’s Taiwan, and keep 60 Legitimacy. If another house reigns and a Zheng is heir, wait for the succession."
 fh_constitution_mandate_of_our_own_completed_desc: "The Zheng crown stands on its own mandate, and Taiwan has an administration to sustain it."
 fh_constitution_mandate_of_our_own_aftermath_tt: "+10 Legitimacy and +10% Bureaucracy (5 years). Radicals: −5% among Army and Fleet supporters; +2% among School of Practical Learning supporters."
 fh_constitution_offer_zheng_cadet: "Name a Zheng Cadet"
 fh_constitution_offer_zheng_cadet_desc: "If no Zheng reigns or stands in line, name a Zheng cadet heir once. The reigning monarch keeps the throne."

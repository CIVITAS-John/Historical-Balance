l_english:
 fh_je_taiping_rebellion: "The Enemy of Our Enemy"
 fh_je_taiping_rebellion_reason: "The Heavenly Kingdom has risen against Qing. We can bargain for recognition of our coast, trading rights, and land that Taiping can cede after a victory. Hold all three coastal regions, and we may instead ask for eligible southern provinces outside Taiping’s original territory."
 fh_taiping_status_fork: "The rebellion has overtaken our mainland debate. Resolve the claim before sending an envoy. The court must decide even if the fighting ends first."
 fh_taiping_status_draft: "Draft terms for the Heavenly Kingdom. $fh_taiping_scores$"
 fh_taiping_status_revision: "[ROOT.GetCountry.GetCustom('fh_taiping_offer_reply')] We can send one revised offer while the rebellion lasts. $fh_taiping_scores$"
 fh_taiping_status_exhausted: "[ROOT.GetCountry.GetCustom('fh_taiping_offer_reply')] We have used both offers. The journal will close when the rebellion ends."
 fh_taiping_scores: "\n\nCurrent willingness: #v [ROOT.GetCountry.MakeScope.ScriptValue('fh_taiping_willingness')|0]#!/4 for the coastal pact, or #v [ROOT.GetCountry.MakeScope.ScriptValue('fh_taiping_expanded_willingness')|0]#!/8 if both heavy commitments are credible. Coastal position contributes #v [ROOT.GetCountry.MakeScope.ScriptValue('fh_taiping_coastal_position')|0]#!. The Taiping court can also decide for itself if player controlled."
 fh_taiping_status_pending: "An offer is with the Heavenly Kingdom. It lapses after 90 days or when the rebellion ends. We will recheck the terms before signing.\n\n[ROOT.GetCountry.GetCustom('fh_taiping_terms_kind')][ROOT.GetCountry.GetCustom('fh_taiping_terms_arms')][ROOT.GetCountry.GetCustom('fh_taiping_terms_fleet')][ROOT.GetCountry.GetCustom('fh_taiping_terms_front')][ROOT.GetCountry.GetCustom('fh_taiping_terms_recognition')]"
 fh_taiping_status_ratified: "The pact is signed. Authorize any promised deliveries below. Southern aid must be authorized within one year of signing. A promise or a pledge to join a play does not count as delivery.\n\n[ROOT.GetCountry.GetCustom('fh_taiping_terms_kind')][ROOT.GetCountry.GetCustom('fh_taiping_terms_arms')][ROOT.GetCountry.GetCustom('fh_taiping_terms_fleet')][ROOT.GetCountry.GetCustom('fh_taiping_terms_front')]\n\n[ROOT.GetCountry.GetCustom('fh_taiping_aid_status')] [ROOT.GetCountry.GetCustom('fh_taiping_trade_status')] Provinces on the signed schedule: #v [ROOT.GetCountry.MakeScope.ScriptValue('fh_taiping_provinces_promised')|0]#!."
 fh_taiping_status_cession: "The fighting has ended and our envoy is waiting for the Heavenly Kingdom’s reply. It has 90 days to honor the eligible cessions.\n\nPromised provinces still outside our rule: #v [ROOT.GetCountry.MakeScope.ScriptValue('fh_taiping_provinces_unfulfilled')|0]#!. [ROOT.GetCountry.GetCustom('fh_taiping_trade_status')]"
 fh_taiping_terms_coast: "#bold Coastal pact#!"
 fh_taiping_terms_south: "#bold Divide the Southern Provinces#!"
 fh_taiping_terms_recognition_only: "#bold Recognition and Trade#!"
 fh_taiping_terms_arsenals: "\n• Supply the arsenals."
 fh_taiping_terms_depots: "\n• Supply both army depots."
 fh_taiping_terms_squadron: "\n• Commit a squadron."
 fh_taiping_terms_river: "\n• Hold the river approaches for six consecutive months."
 fh_taiping_terms_front_pledged: "\n• Fight on an agreed front against Qing."
 fh_taiping_terms_recognition_pledged: "\n• Recognize the Heavenly Kingdom as a wartime government."
 fh_taiping_empty: ""
 fh_taiping_offer_refused: "The Heavenly Kingdom refused the terms."
 fh_taiping_offer_invalid: "The terms are no longer available and the envoy has returned."
 fh_taiping_offer_expired: "The offer expired without a reply."
 fh_taiping_request_audience_decision: "Request an Audience with the Heavenly Kingdom"
 fh_taiping_request_audience_decision_desc: "Send an envoy to learn what the Heavenly Kingdom would pay for our friendship. The journal opens; mobilization is not reset, and no war begins."
 fh_taiping_repudiate_as_recipient: "Repudiate the Tungning Pact"
 fh_taiping_repudiate_as_recipient_desc: "End the agreement with Tungning and cancel outstanding deliveries and cessions. Any ratified trade article follows its own terms."
 fh_taiping_add_arms: "Pledge Arms"
 fh_taiping_add_arms_desc: "Include a small arms shipment in the coastal offer. A credible pledge adds 1 willingness; you authorize the delivery separately after signing."
 fh_taiping_add_arms_ready_tt: "We have a legal supply route, available arms, and the means to deliver."
 fh_taiping_drop_arms: "Withdraw the Arms Pledge"
 fh_taiping_drop_arms_desc: "Remove the arms pledge from the draft. No goods or money have been sent."
 fh_taiping_add_fleet: "Pledge a Squadron"
 fh_taiping_add_fleet_desc: "Include naval aid in the coastal offer. A credible pledge adds 1 willingness; you authorize assistance separately after signing."
 fh_taiping_add_fleet_ready_tt: "We can send legal naval assistance."
 fh_taiping_drop_fleet: "Withdraw the Squadron Pledge"
 fh_taiping_drop_fleet_desc: "Remove the squadron pledge from the draft. No fleet has sailed."
 fh_taiping_add_front: "Offer to Fight Qing"
 fh_taiping_add_front_desc: "Offer to fight Qing on an agreed front. A separate war against the same Qing government can fulfill the pledge. This choice does not join a diplomatic play or start a war."
 fh_taiping_add_front_ready_tt: "We already oppose Qing in a qualifying war or can legally support the original diplomatic play."
 fh_taiping_drop_front: "Withdraw the Front Pledge"
 fh_taiping_drop_front_desc: "Remove the promise to fight Qing from the draft."
 fh_taiping_add_recognition: "Offer Wartime Recognition"
 fh_taiping_add_recognition_desc: "Recognize the Heavenly Kingdom as a wartime government without endorsing its exclusive claim to China. Adds 2 willingness. At signing, the Ming Estates and the current Devout lose 2 Approval each and Tungning loses 5 base Legitimacy for one year."
 fh_taiping_drop_recognition: "Withdraw Wartime Recognition"
 fh_taiping_drop_recognition_desc: "Remove recognition of the Heavenly Kingdom from the draft and forgo its 2 willingness."
 fh_taiping_offer_coast: "Send the Coastal Offer"
 fh_taiping_offer_coast_desc: "Ask for recognition of the coast and five years of trade privileges. Taiping will cede eligible coastal holdings on victory if we deliver aid. Trade can begin at signing if we directly hold two regions or have registered a foothold."
 fh_taiping_offer_coast_ready_tt: "Every selected pledge is credible, and at least one material contribution is included."
 fh_taiping_offer_south: "Divide the Southern Provinces"
 fh_taiping_offer_south_desc: "Keep recognition and trade, and promise twice the ordinary arms shipment and an extended squadron deployment. The southern cessions are Anhui south of the Yangtze, Jiangxi, Hunan, Shaozhou, Guangxi, Guizhou and Yunnan, save for districts Taiping already held when the rising began and land belonging to neither side. The bargain requires two depot deliveries and six consecutive months of naval service, and the aid is authorized separately."
 fh_taiping_offer_south_ready_tt: "We hold all three coasts, know where Taiping started, and can credibly supply the depots and commit six warships."
 fh_taiping_offer_recognition_only: "Offer Recognition and Trade"
 fh_taiping_offer_recognition_only_desc: "There is no eligible southern cession. Send terms for recognition and five years of trade privileges, with neither side pledging wartime deliveries or land."
 fh_taiping_offer_recognition_only_ready_tt: "We hold all three coasts and the recorded southern schedule contains no eligible holdings."
 fh_taiping_break_pact: "Repudiate the Pact"
 fh_taiping_break_pact_desc: "Cancel outstanding deliveries and cessions. The court will be held to its word: a breach costs 10% Influence for three years."
 fh_taiping_pact.1.t: "An Envoy to the Heavenly Kingdom"
 fh_taiping_pact.1.f: "The envoy packs an account book beside his letter of introduction. His clerk asks whether they expect to buy anything. ‘No,’ he says. ‘But I mean to have them write down what they promise.’"
 fh_taiping_pact.1.protestant: "The delegation can speak to Hong’s court in familiar terms, though his theology is his own. Our official faith adds 3 willingness. Choose the terms and commitments in the journal."
 fh_taiping_pact.1.catholic: "The delegates propose an appeal to our shared Christian heritage. The Missions warn against endorsing Hong’s religious claims. Our official faith adds 2 willingness. Choose the terms and commitments in the journal."
 fh_taiping_pact.1.buddhist: "The merchants will carry our offer and promise to protect local worship in our territory. Our official faith adds 1 willingness. Choose the terms and commitments in the journal."
 fh_taiping_pact.1.confucian: "The Academies object to an alliance; the envoy will talk about shipping and arms. Our official faith adds no willingness, but material aid or recognition can win a hearing. Choose the terms and commitments in the journal."
 fh_taiping_pact.1.secular: "The envoy will discuss ports and provisions without asking either court to discuss doctrine. Our official faith adds 1 willingness. Choose the terms and commitments in the journal."
 fh_taiping_pact.1.a: "Draw up the terms."
 fh_taiping_pact.2.t: "An Offer from Tungning"
 fh_taiping_pact.2.coast: "Tungning asks for coastal recognition and five years of trade privileges. Under a coastal pact, eligible coastal holdings fall to them after our victory, provided Tungning makes a material contribution; recognition and trade alone bargain for no land.\n\n[SCOPE.sCountry('fh_taiping_sender').GetCustom('fh_taiping_terms_kind')][SCOPE.sCountry('fh_taiping_sender').GetCustom('fh_taiping_terms_arms')][SCOPE.sCountry('fh_taiping_sender').GetCustom('fh_taiping_terms_fleet')][SCOPE.sCountry('fh_taiping_sender').GetCustom('fh_taiping_terms_front')][SCOPE.sCountry('fh_taiping_sender').GetCustom('fh_taiping_terms_recognition')]\nProvinces on the proposed cession schedule: #v [SCOPE.sCountry('fh_taiping_sender').MakeScope.ScriptValue('fh_taiping_provinces_promised')|0]#!."
 fh_taiping_pact.2.south: "Tungning asks for coastal recognition, five years of trade privileges, and eligible territory outside our rebellion’s home districts. In return it offers two depot deliveries and six uninterrupted months of naval support, with cessions due on victory only if both commitments are kept.\n\n[SCOPE.sCountry('fh_taiping_sender').GetCustom('fh_taiping_terms_kind')][SCOPE.sCountry('fh_taiping_sender').GetCustom('fh_taiping_terms_arms')][SCOPE.sCountry('fh_taiping_sender').GetCustom('fh_taiping_terms_fleet')][SCOPE.sCountry('fh_taiping_sender').GetCustom('fh_taiping_terms_recognition')]\nProvinces on the proposed cession schedule: #v [SCOPE.sCountry('fh_taiping_sender').MakeScope.ScriptValue('fh_taiping_provinces_promised')|0]#!."
 fh_taiping_pact.2.a: "Ratify the pact."
 fh_taiping_pact.2.b: "Refuse the terms."
 fh_taiping_pact.2.c: "Return the offer for revision."
 fh_taiping_pact.2.d: "Leave the offer unanswered."
 fh_taiping_pact.5.t: "Break with the Heavenly Kingdom"
 fh_taiping_pact.5.d: "Renouncing the pact cancels outstanding deliveries and cessions. The court will pay for its change of heart: 10% Influence lost for three years, and Radicals equal to 5% of Army and Fleet supporters if the commander of the fleet backs the mainland campaign."
 fh_taiping_pact.5.b: "Keep our word."
 fh_taiping_recognition_legitimacy: "Wartime Recognition of the Heavenly Kingdom"
 fh_taiping_recognition_legitimacy_desc: "The court recognizes Taiping as a wartime government. Some at home see a rival recognized too soon."
 fh_taiping_recognition_dissent: "Objections to Taiping Recognition"
 fh_taiping_recognition_dissent_desc: "These supporters object to an official bargain with the Heavenly Kingdom."
 fh_taiping_result_abandon: "Squadrons Stand Down"
 fh_taiping_result_abandon_desc: "The fleet stands down. Military Goods Costs fall by 10% for two years; 2% of Maritime Houses supporters are removed from the Radicals."
 fh_taiping_result_broken: "Promises Broken"
 fh_taiping_result_broken_desc: "The accord has been broken. Tungning loses 10% Influence for three years. A mainland-first Army and Fleet gains Radicals equal to 5% of its supporters."
 fh_taiping_result_expanded: "The Southern Bargain Honored"
 fh_taiping_result_expanded_desc: "Both courts delivered and southern territory changed hands. Tungning gains 20 Prestige for five years. Remove Radicals equal to 10% of supporters of a mainland-first Army and Fleet; add 2% among Maritime Houses supporters."
 fh_taiping_result_fulfilled: "The Strait Bargain Honored"
 fh_taiping_result_fulfilled_desc: "Both courts honored the terms. Tungning gains 10 Prestige for three years; remove Radicals equal to 5% of Maritime Houses supporters."
 fh_taiping_result_partial: "The Bargain in Part"
 fh_taiping_result_partial_desc: "Aid earned some return, but parts of the agreement stand unfulfilled. Tungning gains 5 Prestige for two years; a mainland-first Army and Fleet gains Radicals equal to 2% of its supporters."
 fh_taiping_result_no_return: "The Cost of Intervention"
 fh_taiping_result_no_return_desc: "Tungning delivered aid and received no benefit. It loses 10 Prestige for two years; the Maritime Houses gain Radicals equal to 5% of their supporters."
 fh_taiping_result_no_bargain: "An Opening Lost"
 fh_taiping_result_no_bargain_desc: "No effective bargain came of the rebellion. Tungning loses 5% Influence for one year; a mainland-first Army and Fleet gains Radicals equal to 2% of its supporters."
 fh_taiping_trade_status_delivered: "Trade privileges have been delivered."
 fh_taiping_trade_status_canceled: "The trade article no longer delivers privileges."
 fh_taiping_trade_status_blocked: "Trade privileges are due, but the article cannot yet take effect."
 fh_taiping_trade_status_waiting: "Trade privileges become due with the first material contribution."
 fh_taiping_aid_status_heavy_earned: "Both depots and the required naval service are complete."
 fh_taiping_aid_status_heavy_pending: "Army depots supplied: #v [ROOT.GetCountry.MakeScope.ScriptValue('fh_taiping_depot_progress')|0]#!/2. [ROOT.GetCountry.GetCustom('fh_taiping_naval_service_status')]"
 fh_taiping_aid_status_delivered: "A material contribution has reached the Heavenly Kingdom."
 fh_taiping_aid_status_waiting: "No material contribution has reached the Heavenly Kingdom yet."
 fh_taiping_service_complete: "Six consecutive months of naval service are complete."
 fh_taiping_service_active: "The squadron is on station. It must serve for six consecutive months."
 fh_taiping_service_inactive: "No qualifying squadron is on station."
 fh_taiping_expanded_cost_preview: "Southern aid: 20 Small Arms weekly for six months, or two funded shipments each costing 10% of gold reserve capacity. Detach at least six combat ships from port for up to a year at a cost of 25% Naval Power Projection. The regions below contain the ordinary provinces on the proposed cession schedule."
 fh_taiping_ordinary_arms_preview: "An arms shipment uses a six-month Small Arms article or costs 5% of gold reserve capacity if the article is unavailable."
 fh_taiping_ordinary_fleet_preview: "An off-map escort needs three combat ships and costs 15% Naval Power Projection for six months. A legal donation permanently transfers one combat ship."

l_english:
 fh_manila_petitions.1.t: "Manila Merchants Need Warehouses"
 fh_manila_petitions.1.d: "Merchants from Manila are asking for bonded warehouses on Taiwan. They would keep their cargo under customs seal until they find a buyer, and sleep easier for it. The Maritime Houses want to run the warehouses themselves; the treasury would rather auction the leases and pocket the difference."
 fh_manila_petitions.1.a: "Fit out bonded warehouses"
 fh_manila_petitions.1.a_tt: "Spend @money![ROOT.GetCountry.MakeScope.ScriptValue('fh_manila_petition_cash')|0] (2% of the Gold Reserves cap). Taiwan gains #p +15%#! Trade Advantage for one year."
 fh_manila_petitions.1.b: "Auction the leases"
 fh_manila_petitions.1.b_tt: "Collect @money![ROOT.GetCountry.MakeScope.ScriptValue('fh_manila_petition_cash')|0] (2% of the Gold Reserves cap). The Maritime Houses lose #n 2#! Approval for one year."
 fh_manila_petitions.2.t: "Two Ports Ask for the Same Rice"
 fh_manila_petitions.2.d: "A cargo of rice is ready to sail. Manila placed the first order, but Taiwan’s merchants have asked the court to buy the whole shipment before it leaves the roads. We can pay for one delivery, and one only."
 fh_manila_petitions.2.a: "Honor Manila’s order"
 fh_manila_petitions.2.a_tt: "Spend @money![ROOT.GetCountry.MakeScope.ScriptValue('fh_manila_petition_cash')|0] (2% of the Gold Reserves cap). Gain #p 10#! Relations with the Philippines and remove Radicals equal to #p 5%#! of the population in Manila’s state."
 fh_manila_petitions.2.b: "Buy it for Taiwan"
 fh_manila_petitions.2.b_tt: "Spend @money![ROOT.GetCountry.MakeScope.ScriptValue('fh_manila_petition_cash')|0] (2% of the Gold Reserves cap). Taiwan’s lower strata gain #p +1#! Standard of Living for six months. Lose #n 5#! Relations with the Philippines."
 fh_manila_petitions.3.t: "The Sisters Ask for the Old Quarantine Station"
 fh_manila_petitions.3.d: "The Catholic Missions want to turn the old quarantine station into a free hospital. The public works office has put in a competing request on the same paper: the site would make a convenient yard for storing stone and timber."
 fh_manila_petitions.3.a: "Grant the site for a free hospital"
 fh_manila_petitions.3.a_tt: "Mortality in Taiwan falls by #p 10%#! for two years. The Catholic Missions gain #p 2#! Approval for one year."
 fh_manila_petitions.3.b: "Reserve the site for a public works yard"
 fh_manila_petitions.3.b_tt: "Taiwan gains #p +10%#! Construction Efficiency for two years. The Catholic Missions lose #n 2#! Approval for one year."
 fh_manila_petitions.dismiss: "Let the petition pass"
 fh_manila_bonded_warehouses: "Bonded Warehouses"
 fh_manila_warehouse_concession_denied: "Warehouse Concession Denied"

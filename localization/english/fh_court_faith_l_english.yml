 fh_court_faith.2.t: "The Settlement Audience"
 fh_court_faith.2.d: "The herald reads the delegates’ choice twice: [SCOPE.sReligion('fh_court_faith_candidate').GetName] is to be the court’s official faith. On the table lie the Yongli Articles, their seal unbroken. A minister opens his mouth, then reaches for the Articles instead. The keeper of the records sets down the calendar. ‘Thirty days,’ he says. ‘If no order comes by then, these stand.’ He leaves one finger on the old seal."
 fh_court_faith.2.keep: "Keep the Yongli Articles."
 fh_court_faith.2.repeal: "Repeal the Yongli Articles."
 fh_court_faith.2.establish: "Establish the settled faith."
 fh_court_faith.2.separate: "Separate church and state."
 fh_court_faith.11.t: "Who Shall Teach the Children?"
 fh_court_faith.11.d: "The mission priest sets three copybooks on the table: letters, sums, and a page of catechism. ‘Forty children come to the port school,’ he says, ‘and twice forty are turned away.’ The clerk of the court counts the cost of benches and teachers. A scholar across the table asks, ‘And the classics?’ The priest raises his head. ‘Their fathers want them to keep accounts.’ ‘Their fathers will not always keep shops,’ the scholar says."
 fh_court_faith.11.f: "Afterward, [SCOPE.sCharacter('fh_court_faith_speaker_luo').GetFullName] folds his list of teachers and tucks it into his sleeve. [SCOPE.sCharacter('fh_court_faith_speaker_xu').GetFullName] has written a line of the Analects on a slip of paper. ‘They will need both,’ Xu says. ‘Then find the money for both,’ Luo replies."
 fh_court_faith.11.a: "Put the missions in charge."
 fh_court_faith.11.b: "Fund classical tutors."
 fh_court_faith.12.t: "A Chaplain from Manila"
 fh_court_faith.12.d: "The chaplain stands at the Manila ship’s gangplank, the only passenger in black among the crates, while the harbor clerk goes down the manifest. A merchant taps the column for silk and tea. ‘We asked for a factor,’ he says. ‘Manila sent a priest.’ The clerk glances toward the court’s gallery. ‘Manila sent both.’"
 fh_court_faith.12.f: "[SCOPE.sCharacter('fh_court_faith_speaker_luo').GetFullName] stands at the end of the quay with a dry cloak over his arm, watching the chaplain pick his way down the gangplank. ‘You are late,’ he says. ‘The tide was,’ the chaplain replies."
 fh_court_faith.12.a: "Receive the chaplain."
 fh_court_faith.12.b: "Send a secular delegation."
 fh_court_faith.13.t: "The Printing House"
 fh_court_faith.13.d: "The delegate from Sinkan lays a bundle of manuscripts on the composing table. The press stands idle under its wooden screw. The foreman opens one and finds Siraya words in Latin letters, corrected in a Dutch hand. ‘How many sheets?’ he asks. ‘Enough for the congregations,’ the delegate says. The foreman looks at the paper account, then at the classical readers waiting in their crate. He sets the account beside the manuscripts. ‘One run,’ he says, and waits."
 fh_court_faith.13.f: "[SCOPE.sCharacter('fh_court_faith_speaker_talavan').GetFullName] has wrapped the manuscripts in oilcloth against the harbor damp. [SCOPE.sCharacter('fh_court_faith_speaker_xu').GetFullName] follows a line of Siraya with his finger and sets the page down. ‘A new alphabet for the compositors,’ he says. ‘The same letters,’ Talavan says. ‘New words.’"
 fh_court_faith.13.a: "Print translations for the missions."
 fh_court_faith.13.b: "Print classical readers."
 fh_court_faith.14.t: "The Academy's Appeal"
 fh_court_faith.14.d: "The academy tutor turns the examination register so the court can read the names. ‘Every name here was taught by our own tutors,’ he says. In the courtyard a mission graduate waits with his certificate; the doorkeeper will not take it. The tutor dips his brush. ‘He can read,’ he says. ‘The register asks who taught him.’"
 fh_court_faith.14.a: "Admit mission graduates to the examinations."
 fh_court_faith.14.b: "Keep the classical examinations as they are."
 fh_court_faith.15.t: "A Temple School Endowment"
 fh_court_faith.15.d: "The temple steward opens the pledge book on the altar step. ‘Rents from three halls,’ he says, ‘a vegetable plot, and a widow’s bequest.’ The rents would pay for two schoolrooms. ‘We ask only that the court enter our names in the register.’ A mission priest waits with a heavier purse and an offer to match it. The steward leaves the purse where it lay and turns to the children on the temple floor."
 fh_court_faith.15.a: "Invite the missions to match the endowment."
 fh_court_faith.15.b: "Recognize the temple schools."
 fh_court_faith.16.t: "A Visit to the Reformed Congregations"
 fh_court_faith.16.d: "A boat from the treaty partner lies off the quay with a crate of primers and teachers waiting for leave to land. The Reformed deacon brings the key to his schoolhouse; a Catholic priest and a Confucian tutor follow him to the customs desk. ‘Whose name goes on their invitation?’ the priest asks. The clerk holds up the paper. The place for the court’s seal is still bare."
 fh_court_faith.16.f: "[SCOPE.sCharacter('fh_court_faith_speaker_talavan').GetFullName] has already found three families in Sinkan to lodge the teachers. He meets them at the door with a lamp. ‘The primers can wait,’ he says. ‘They will want beds first.’"
 fh_court_faith.16.a: "Welcome the Reformed teachers."
 fh_court_faith.16.b: "Keep the agreement to secular matters."
 fh_court_faith_event_no_response: "Let the matter rest."

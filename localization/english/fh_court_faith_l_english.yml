 fh_court_faith_convert_confucian_tt: "0.5% of Taiwan's non-Confucian population converts to Confucianism."
 fh_court_faith_convert_mahayana_tt: "0.5% of Taiwan's population that follows other faiths converts to Mahayana Buddhism."
 fh_court_faith_keep_tt: "Keep Freedom of Conscience and the Articles. Recognize all faiths (−2% Radicals). Modifier: 3 years."
 fh_court_faith_repeal_tt: "Keep Freedom of Conscience; repeal the Articles. Recognize the state faith and others of its heritage (−5% Radicals); remaining faiths +2%. Modifier: 4 years."
 fh_court_faith_establish_tt: "Repeal the Articles; enact State Religion. Recognize only the official faith (−10% Radicals); others +5%. Modifier: 5 years."
 fh_court_faith_separate_tt: "Repeal the Articles; enact Total Separation. Recognize all faiths (−5% Radicals). Modifier: 2 years."

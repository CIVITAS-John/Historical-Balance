 fh_court_faith_nominate_catholic_desc: "Nominate Catholicism and move the balance 12 points toward Christianity. Conversion restrictions ease until another faith is nominated."
 fh_court_faith_nominate_protestant: "Hear the Reformed Congregations"
 fh_court_faith_nominate_protestant_desc: "Nominate Protestantism and move the balance 12 points toward Christianity."

 fh_court_faith.2.t: "The Settlement Audience"
 fh_court_faith.2.d: "The delegates have chosen [SCOPE.sReligion('fh_court_faith_candidate').GetName] as the official faith. The court must decide how the law will treat the island's other congregations. If no decision is made within thirty days, the Yongli Articles remain in force."
 fh_court_faith.2.keep: "Keep the Yongli Articles."
 fh_court_faith.2.repeal: "Repeal the Yongli Articles."
 fh_court_faith.2.establish: "Establish the settled faith."
 fh_court_faith.2.separate: "Separate church and state."
 fh_court_faith.11.t: "Who Shall Teach the Children?"
 fh_court_faith.11.d: "The Catholic missions ask the court for classrooms. A scholar at the hearing argues that their pupils should learn the classics as well as letters and arithmetic."
 fh_court_faith.11.f: "Father [SCOPE.sCharacter('fh_court_faith_speaker_luo').GetFullName] brings a list of teachers ready for posts. [SCOPE.sCharacter('fh_court_faith_speaker_xu').GetFullName] asks who will teach their pupils the classics."
 fh_court_faith.11.a: "Put the missions in charge."
 fh_court_faith.11.b: "Fund classical tutors."
 fh_court_faith.12.t: "A Chaplain from Manila"
 fh_court_faith.12.d: "A Spanish ship under the Manila Compact has brought a chaplain with its cargo. The clergy would have the court receive him; the merchants want a delegation about trade alone."
 fh_court_faith.12.f: "Father [SCOPE.sCharacter('fh_court_faith_speaker_luo').GetFullName] waits at the quay to greet the visitor."
 fh_court_faith.12.a: "Receive the chaplain."
 fh_court_faith.12.b: "Send a secular delegation."
 fh_court_faith.13.t: "The Printing House"
 fh_court_faith.13.d: "A delegate from Sinkan has brought Siraya manuscripts to the university press. The printers can set the missions' translations, or readers drawn from the classics."
 fh_court_faith.13.f: "[SCOPE.sCharacter('fh_court_faith_speaker_talavan').GetFullName] has gathered the manuscripts. [SCOPE.sCharacter('fh_court_faith_speaker_xu').GetFullName] argues that printing them would put useful books in another generation's hands."
 fh_court_faith.13.a: "Print translations for the missions."
 fh_court_faith.13.b: "Print classical readers."
 fh_court_faith.14.t: "The Academy's Appeal"
 fh_court_faith.14.d: "The Ming Estates bring a petition from the academies: keep the classical examinations, and say whether pupils taught by the missions may sit them."
 fh_court_faith.14.a: "Admit mission graduates to the examinations."
 fh_court_faith.14.b: "Keep the classical examinations as they are."
 fh_court_faith.15.t: "A Temple School Endowment"
 fh_court_faith.15.d: "Several Mahayana temples have pooled their rents to open schools. They ask the court's recognition; the missions offer to match the endowment."
 fh_court_faith.15.a: "Invite the missions to match the endowment."
 fh_court_faith.15.b: "Recognize the temple schools."
 fh_court_faith.16.t: "A Visit to the Reformed Congregations"
 fh_court_faith.16.d: "A Protestant treaty partner offers teachers and books. The Reformed congregations welcome them; Catholic clergy and Confucian tutors object to the court's name on the visit."
 fh_court_faith.16.f: "[SCOPE.sCharacter('fh_court_faith_speaker_talavan').GetFullName] has already found families in Sinkan willing to lodge the schoolteachers."
 fh_court_faith.16.a: "Welcome the Reformed teachers."
 fh_court_faith.16.b: "Keep the agreement to secular matters."
 fh_court_faith_event_no_response: "Let the matter rest."
 fh_court_faith_event_christian_tt: "Move the Court Balance 5 points toward Christianity."

l_english:
 fh_je_court_faith: "The Faith of the Court"
 fh_je_court_faith_reason: "The Yongli Articles were drawn for the Catholics of the Manila bargain; they now shelter every congregation on the island. The court has ten years to name an official faith and to say whether the Articles stand. Until then the Articles cannot be repealed, and the Church and State laws are fixed.\n\nThe faiths of Taiwan weigh in the debate, and a treaty with a Protestant power can bring Reformed teachers to the island.\n\nWere the question put today, the court would profess #b [ROOT.GetCountry.GetCustom('fh_court_faith_likely_religion')]#!."
 fh_court_faith_church_law_locked_tt: "Settle the court's faith before changing Church and State laws."
 fh_court_faith_settlement_required_tt: "Settle the court's faith at either end of the debate, or on its tenth anniversary."
 fh_court_faith_interruption_tt: "Another law replaces Freedom of Conscience, or the Articles are removed, before settlement."
 fh_court_faith_settled_desc: "The court has fixed its official faith and the standing of the Yongli Articles."
 fh_court_faith_interrupted_desc: "The court left the audience unfinished once the Articles fell out of force."

l_english:
 fh_je_court_faith: "The Faith of the Court"
 fh_je_court_faith_reason: "The Yongli Articles shelter the court's Catholic allies and the island's other congregations. The court has ten years to choose an official faith and decide whether the Articles stand; until then they cannot be repealed and the Church and State laws are fixed.\n\nThe faiths of Tungning's Taiwan weigh in the debate, and a treaty with a Protestant power can bring Reformed teachers to the island.\n\nWere the question put today, the court would adopt #b [ROOT.GetCountry.GetCustom('fh_court_faith_likely_religion')]#!."
 fh_court_faith_church_law_locked_tt: "Settle the court's faith before changing Church and State laws."
 fh_court_faith_settlement_required_tt: "Settle the court's faith at either end of the debate, or on its tenth anniversary."
 fh_court_faith_interruption_tt: "Another law replaces Freedom of Conscience, or the Articles are removed, before settlement."
 fh_court_faith_settled_desc: "The court has fixed its official faith and the standing of the Yongli Articles."
 fh_court_faith_interrupted_desc: "The court abandoned the audience once the Articles fell out of force."
 fh_court_faith_balance: "Court Balance"
 fh_court_faith_ancestral_side: "Ancestral Traditions"

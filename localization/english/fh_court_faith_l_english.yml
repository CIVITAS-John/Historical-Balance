 fh_court_faith.2.t: "The Settlement Audience"
 fh_court_faith.2.d: "The herald read the delegates’ choice twice: [SCOPE.sReligion('fh_court_faith_candidate').GetName] would be the court’s official faith. On the table lay the Yongli Articles, their seal unbroken. A minister opened his mouth, then reached for the Articles instead. The keeper of records set down the calendar. ‘Thirty days,’ he said. ‘If there’s no order by then, these stand.’ He left his finger on the old seal."
 fh_court_faith.2.keep: "Keep the Yongli Articles."
 fh_court_faith.2.repeal: "Repeal the Yongli Articles."
 fh_court_faith.2.establish: "Establish the settled faith."
 fh_court_faith.2.separate: "Separate church and state."
 fh_court_faith.11.t: "Who Shall Teach the Children?"
 fh_court_faith.11.d: "‘Forty children in the port,’ the mission priest said, ‘and twice that turned away.’ He spread three copybooks on the table: letters, sums, and a page of catechism. The court clerk counted the cost of benches and teachers. A scholar across the table asked, ‘And the classics?’ The priest raised his head. ‘Their fathers want them to keep accounts.’ ‘Their fathers will not always be shopkeepers,’ the scholar said."
 fh_court_faith.11.f: "Afterward, [SCOPE.sCharacter('fh_court_faith_speaker_luo').GetFullName] folded his list of teachers and tucked it into his sleeve. [SCOPE.sCharacter('fh_court_faith_speaker_xu').GetFullName] had written a line of the Analects on a slip of paper. ‘They will need both,’ Xu said. ‘Then find the money for both,’ Luo replied."
 fh_court_faith.11.a: "Put the missions in charge."
 fh_court_faith.11.b: "Fund classical tutors."
 fh_court_faith.12.t: "A Chaplain from Manila"
 fh_court_faith.12.d: "The chaplain stood at the Manila ship’s gangplank, the only passenger in black among the crates, while the harbor clerk checked the manifest. A merchant tapped the column for silk and tea. ‘We asked for a factor,’ he said. ‘Manila sent a priest.’ The harbor clerk glanced toward the court’s gallery. ‘Manila sent both.’"
 fh_court_faith.12.f: "[SCOPE.sCharacter('fh_court_faith_speaker_luo').GetFullName] stood at the end of the quay with a dry cloak over his arm, watching the chaplain pick his way down the gangplank. ‘You are late,’ he said. ‘The tide was,’ the chaplain replied."
 fh_court_faith.12.a: "Receive the chaplain."
 fh_court_faith.12.b: "Send a secular delegation."
 fh_court_faith.13.t: "The Printing House"
 fh_court_faith.13.d: "The Sinkan delegate laid a bundle of manuscripts on the composing table; the press stood idle under its wooden screw. The foreman opened one and found Siraya words in Latin letters, with corrections in a Dutch hand. ‘How many sheets?’ he asked. ‘Enough for the congregations,’ the delegate said. The foreman looked at the paper account, then at the classical readers waiting in their crate. He set the account beside the manuscripts. ‘One run,’ he said, and waited."
 fh_court_faith.13.f: "[SCOPE.sCharacter('fh_court_faith_speaker_talavan').GetFullName] had wrapped the manuscripts in oilcloth against the harbor damp. [SCOPE.sCharacter('fh_court_faith_speaker_xu').GetFullName] followed a line of Siraya with his finger and set the page down. ‘A new alphabet for the compositors,’ he said. ‘The same letters,’ Talavan said. ‘New words.’"
 fh_court_faith.13.a: "Print translations for the missions."
 fh_court_faith.13.b: "Print classical readers."
 fh_court_faith.14.t: "The Academy's Appeal"
 fh_court_faith.14.d: "‘Every name here was trained by our own tutors,’ the academy tutor said, turning the examination register so the court could see the names. In the courtyard a mission graduate waited with his certificate; the doorkeeper would not take it. The tutor dipped his brush. ‘He can read,’ he said. ‘The register asks who taught him.’"
 fh_court_faith.14.a: "Admit mission graduates to the examinations."
 fh_court_faith.14.b: "Keep the classical examinations as they are."
 fh_court_faith.15.t: "A Temple School Endowment"
 fh_court_faith.15.d: "‘Rents from three halls,’ the temple steward said, ‘a vegetable plot, and a widow’s bequest.’ He opened the pledge book on the altar step; the rents would pay for two schoolrooms. ‘We ask only that the court write our names in the register.’ A priest from the mission waited with a heavier purse and an offer to match it. The steward left the purse where it lay and turned to the children on the temple floor."
 fh_court_faith.15.a: "Invite the missions to match the endowment."
 fh_court_faith.15.b: "Recognize the temple schools."
 fh_court_faith.16.t: "A Visit to the Reformed Congregations"
 fh_court_faith.16.d: "A boat from the treaty partner lay off the quay with a crate of primers and teachers waiting for leave to land. A Reformed deacon brought the key to his schoolhouse. A Catholic priest and a Confucian tutor followed him to the customs desk. ‘Tell me whose name goes on their invitation,’ the priest said. The clerk held up the paper. The place for the court’s seal was still bare."
 fh_court_faith.16.f: "[SCOPE.sCharacter('fh_court_faith_speaker_talavan').GetFullName] had already found three families in Sinkan to lodge the teachers. He met them at the door with a lamp. ‘The primers can wait,’ he said. ‘They will want beds first.’"
 fh_court_faith.16.a: "Welcome the Reformed teachers."
 fh_court_faith.16.b: "Keep the agreement to secular matters."
 fh_court_faith_event_no_response: "Let the matter rest."

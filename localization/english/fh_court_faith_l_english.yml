l_english:
 fh_je_court_faith: "The Faith of the Court"
 fh_je_court_faith_reason: "The Yongli Articles protect the court's Catholic allies and the island's other congregations. The court now has ten years to choose its official faith and decide whether to keep the Articles. Until the settlement, the Articles cannot be repealed and Church and State laws cannot be changed.\n\nThe faiths followed in Tungning's Taiwan shape the debate. A treaty with a Protestant country can bring Reformed teachers to the island.\n\nIf the debate ended today, the court would adopt #b [ROOT.GetCountry.GetCustom('fh_court_faith_likely_religion')]#!."
 fh_court_faith_church_law_locked_tt: "The court must settle its faith before the Church and State laws can change."
 fh_court_faith_settlement_required_tt: "Settle the court's official faith at either end of the debate or on the tenth anniversary."
 fh_court_faith_interruption_tt: "Another law replaces Freedom of Conscience or the Yongli Articles are removed before settlement."
 fh_court_faith_settled_desc: "The court settled its official faith and the place of the Yongli Articles in its laws."
 fh_court_faith_interrupted_desc: "The court abandoned the audience when the Yongli Articles ceased to be in force."
 fh_court_faith_balance: "Court Balance"
 fh_court_faith_ancestral_side: "Ancestral Traditions"
 fh_court_faith_christian_side: "Christianity"
 fh_court_faith_manila_drift: "Active Manila Compact"
 fh_court_faith_missions_drift: "Catholic Missions in Government"
 fh_court_faith_traditionalist_drift: "Ming Estates or a Traditionalist Leader in Government"
 fh_court_faith_christian_overlord_drift: "Christian Overlord"
 fh_court_faith_nonchristian_overlord_drift: "Non-Christian Overlord"
 fh_court_faith_taiwan_drift: "Balance of Faiths in Tungning's Taiwan"
 fh_court_faith_nominate_catholic: "Hear the Catholic Missions"
 fh_court_faith_nominate_catholic_desc: "Nominate Catholicism and move the debate 12 points towards Christianity. This eases the debate's conversion restrictions until another faith is nominated."
 fh_court_faith_nominate_protestant: "Hear the Reformed Congregations"
 fh_court_faith_nominate_protestant_desc: "Nominate Protestantism and move the debate 12 points towards Christianity."
 fh_court_faith_nominate_confucian: "Consult the Confucian Academies"
 fh_court_faith_nominate_confucian_desc: "Nominate Confucianism and move the debate 12 points towards the ancestral traditions."
 fh_court_faith_nominate_mahayana: "Consult the Mahayana Temples"
 fh_court_faith_nominate_mahayana_desc: "Nominate Mahayana Buddhism and move the debate 12 points towards the ancestral traditions."
 fh_court_faith_religion_catholic: "Catholicism"
 fh_court_faith_religion_protestant: "Protestantism"
 fh_court_faith_religion_confucian: "Confucianism"
 fh_court_faith_religion_mahayana: "Mahayana Buddhism"
 fh_court_faith.2.t: "The Settlement Audience"
 fh_court_faith.2.d: "The delegates have chosen [SCOPE.sReligion('fh_court_faith_candidate').GetName] as the official faith. The court must decide how the law will treat the island's other congregations. If no decision is made within thirty days, the Yongli Articles will remain in force."
 fh_court_faith.2.keep: "Keep the Yongli Articles."
 fh_court_faith.2.repeal: "Repeal the Yongli Articles."
 fh_court_faith.2.establish: "Establish the settled faith."
 fh_court_faith.2.separate: "Separate church and state."
 fh_court_faith.11.t: "Who Shall Teach the Children?"
 fh_court_faith.11.d: "The Catholic missions have asked the court for classrooms. A scholar at the hearing argues that mission pupils should study the classics as well as reading and arithmetic."
 fh_court_faith.11.f: "Father [SCOPE.sCharacter('fh_court_faith_speaker_luo').GetFullName] brings a list of teachers ready to take up posts. [SCOPE.sCharacter('fh_court_faith_speaker_xu').GetFullName] asks who will teach their pupils the classics."
 fh_court_faith.11.a: "Put the missions in charge."
 fh_court_faith.11.b: "Fund classical tutors."
 fh_court_faith.12.t: "A Chaplain from Manila"
 fh_court_faith.12.d: "A Spanish ship under the Manila Compact has brought a chaplain as well as a cargo. Local priests want the court to receive him; merchants would prefer a delegation concerned with trade alone."
 fh_court_faith.12.f: "Father [SCOPE.sCharacter('fh_court_faith_speaker_luo').GetFullName] waits at the quay to greet the visitor."
 fh_court_faith.12.a: "Receive the chaplain."
 fh_court_faith.12.b: "Send a secular delegation."
 fh_court_faith.13.t: "The Printing House"
 fh_court_faith.13.d: "A delegate from Sinkan has brought Siraya manuscripts to the university press. The printers can set the missions' translations or print readers drawn from the classics."
 fh_court_faith.13.f: "[SCOPE.sCharacter('fh_court_faith_speaker_talavan').GetFullName] has collected the manuscripts. [SCOPE.sCharacter('fh_court_faith_speaker_xu').GetFullName] argues that printing them would put useful books within reach of another generation of pupils."
 fh_court_faith.13.a: "Print translations for the missions."
 fh_court_faith.13.b: "Print classical readers."
 fh_court_faith.14.t: "The Academy's Appeal"
 fh_court_faith.14.d: "The Ming Estates have brought a petition from the academies. They ask that the court keep the classical examinations and decide whether pupils educated by the missions may sit them."
 fh_court_faith.14.a: "Admit mission graduates to the examinations."
 fh_court_faith.14.b: "Keep the classical examinations as they are."
 fh_court_faith.15.t: "A Temple School Endowment"
 fh_court_faith.15.d: "Several Mahayana temples have pooled their rents to open schools. Their trustees ask for recognition from the court, while the missions offer to match the endowment."
 fh_court_faith.15.a: "Invite the missions to match the endowment."
 fh_court_faith.15.b: "Recognize the temple schools."
 fh_court_faith.16.t: "A Visit to the Reformed Congregations"
 fh_court_faith.16.d: "A Protestant treaty partner has offered to send teachers and books to Taiwan. The Reformed congregations welcome the offer; Catholic clergy and Confucian tutors object to the court lending its name to the visit."
 fh_court_faith.16.f: "[SCOPE.sCharacter('fh_court_faith_speaker_talavan').GetFullName] has already found families willing to lodge the schoolteachers in Sinkan."
 fh_court_faith.16.a: "Welcome the Reformed teachers."
 fh_court_faith.16.b: "Keep the agreement to secular matters."
 fh_court_faith_event_no_response: "Let the matter rest."
 fh_court_faith_event_christian_tt: "Move the Court Balance 5 points toward Christianity."
 fh_court_faith_event_ancestral_tt: "Move the Court Balance 5 points toward ancestral traditions."
 fh_court_faith_mission_school_reaction_tt: "Taiwan's Catholic Pops lose 1% Radicals. Pops of other faiths gain 1% Radicals."
 fh_court_faith_convert_catholic_tt: "0.5% of Taiwan's non-Catholic population converts to Catholicism."
 fh_court_faith_convert_protestant_tt: "0.5% of Taiwan's non-Protestant population converts to Protestantism."
 fh_court_faith_convert_confucian_tt: "0.5% of Taiwan's non-Confucian population converts to Confucianism."
 fh_court_faith_convert_mahayana_tt: "0.5% of Taiwan's population that follows other faiths converts to Mahayana Buddhism."
 fh_court_faith_keep_tt: "Keep Freedom of Conscience and the Articles. All congregations are recognized (−2% Radicals). The faith's settlement modifier lasts 3 years."
 fh_court_faith_repeal_tt: "Keep Freedom of Conscience but remove the Articles. The official faith and faiths that share its religious heritage are recognized (−5% Radicals); other faiths gain +2% Radicals. The settlement modifier lasts 4 years."
 fh_court_faith_establish_tt: "Remove the Articles and adopt State Religion. Only the official faith is recognized (−10% Radicals); other faiths gain +5% Radicals. The settlement modifier lasts 5 years."
 fh_court_faith_separate_tt: "Remove the Articles and adopt Total Separation. All congregations are recognized (−5% Radicals). The settlement modifier lasts 2 years."
 fh_court_faith_catholic_reward_tt: "The Manila Connection: +10 Prestige, +10% Trade Advantage in Taiwan, and +10 Relations with Spain and the Philippines. Devout approval rises by 2 for three years."
 fh_court_faith_protestant_reward_tt: "The Translators' Press: +15% Technology Spread and −10 Relations with Spain and the Philippines. The Devout and an eligible sponsor gain +2 approval for three years."
 fh_court_faith_confucian_reward_tt: "The Academies Restored: +10% Bureaucracy and −10 Relations with Spain and the Philippines. The Devout and an eligible sponsor gain +2 approval for three years."
 fh_court_faith_mahayana_reward_tt: "Patronage of the Temples: +10 Prestige, +15% Qualifications in Taiwan, and −10 Relations with Spain and the Philippines. Devout approval rises by 2 for three years."

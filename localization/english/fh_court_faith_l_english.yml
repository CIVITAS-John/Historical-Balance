 fh_court_faith_nominate_confucian_desc: "Nominate Confucianism and move the balance 12 points toward the ancestral traditions."
 fh_court_faith_nominate_mahayana: "Consult the Mahayana Temples"
 fh_court_faith_nominate_mahayana_desc: "Nominate Mahayana Buddhism and move the balance 12 points toward the ancestral traditions."

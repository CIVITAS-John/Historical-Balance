l_english:
 fh_je_mainland_claim: "The Claim Across the Strait"
 fh_je_mainland_claim_reason: "The court must decide whether Tungning still speaks for the Ming. Reassert the claim at 200, or open talks with Qing at 0. Direct ownership of all ordinary land in Fujian, Guangdong, or Zhejiang settles the claim in favor of reassertion unless the court has already reached the Taiping fork. Foreign treaty ports are exempt."
 fh_je_mainland_claim_status: "$fh_mainland_claim_debate_status$"
 fh_mainland_claim_debate_status: "The court is still debating the claim."
 fh_mainland_claim_offer_status: "The debate is suspended while the court waits up to 90 days for Qing’s answer. If Qing refuses or the offer lapses, Tungning will renounce without an accord."
 fh_mainland_claim_blocked_trade_status: "The full Qing offer is currently unavailable. Trade privileges require an eligible market arrangement and cannot be granted under full Isolationism. Without an accord, reaching 0 still renounces the claim."
 fh_mainland_claim_blocked_offer_status: "The full Qing offer is currently unavailable. Qing must be able to take a tributary, and Tungning cannot be at war with Qing or subject to another overlord. Without an accord, reaching 0 still renounces the claim."
 fh_mainland_claim_fork_status: "The Heavenly Kingdom has risen. The council must choose whether to act on the mainland claim. Its decision will remain available even if the rebellion ends."
 fh_mainland_claim_tone_status: "The court has agreed to reassert the claim. It must decide how to address Qing."
 fh_mainland_claim_reasserted_header: "Reassert the Mainland Claim"
 fh_mainland_claim_ratified_header: "Renounce with the Strait Settlement"
 fh_mainland_claim_renounced_header: "Renounce without an Accord"
 fh_mainland_claim_abandoned_header: "Close the Book on the Mainland"
 fh_mainland_claim_reasserted_desc: "Tungning has reasserted its claim. The court begins mobilizing to pursue its remaining coastal claims. The constitution will be debated once that mobilization ends."
 fh_mainland_claim_ratified_desc: "The court has exchanged the old claim for recognition as Qing’s tributary, reduced tribute, and trade privileges. The constitution can now be debated, with Ming restoration closed."
 fh_mainland_claim_renounced_desc: "The court has dropped the mainland claim without a settlement with Qing. Existing diplomacy stands. The constitution can now be debated, with Ming restoration closed."
 fh_mainland_claim_abandoned_desc: "Tungning has abandoned its dynastic mainland project. The constitution can now be debated, with the Ming and scripted mainland routes closed."
 fh_reopen_taiping_fork: "Call the Council Back"
 fh_reopen_taiping_fork_desc: "Return to the council’s decision on the mainland claim."
 fh_mainland_fork_ready_tt: "There is no open council audience"
 fh_mainland_claim.1.t: "The Words of the Declaration"
 fh_mainland_claim.1.d: "The last memorial has been read. The ministers agree to renew Tungning’s claim on the mainland. The wording is still in our hands: we may mark our claim and prepare quietly, or invite Qing to answer us in public."
 fh_mainland_claim.2.t: "The Last Chance"
 fh_mainland_claim.2.d: "The Heavenly Kingdom has taken up arms against Qing. The council recalls the last time a struggle on the mainland opened the way back to Fujian. If we still mean to return, now is the time to say so. If Tungning’s future lies across the southern seas, we can put the old claim to rest."
 fh_mainland_claim_measured: "Issue a measured declaration."
 fh_mainland_claim_public: "Challenge Qing in public."
 fh_mainland_claim_abandon: "Close the book on the mainland."
 fh_mainland_claim_defer: "Leave the decision before the council."
 fh_mainland_claim_measured_tt: "Reassert the claim and begin mobilization. Gain #bold Mandate Reaffirmed#! (+10 base Legitimacy, declining over 5 years). Remove 10% Radicals among claim backers and add 2% among accommodation backers. Relations with Qing fall by 30 if Qing still exists."
 fh_mainland_claim_public_tt: "Reassert the claim and begin mobilization. Gain #bold Mandate Reaffirmed#! (+10 base Legitimacy, declining over 7 years). Remove 10% Radicals among claim backers and add 5% among accommodation backers. Relations with Qing fall by 60 if Qing still exists."
 fh_mainland_claim_abandon_tt: "Renounce without making an offer to Qing and permanently close the scripted mainland and Taiping aid routes. For 2 years, gain #bold The Island Comes First#! (+10% Trade Advantage) and #bold Squadrons Stand Down#! (−10% Military Goods Costs). Add 2% Radicals among claim backers and remove 2% among Maritime Houses supporters."
 fh_mainland_mobilization_preview_tt: "For up to 3 years, #bold Mobilization Across the Strait#! gives Tungning +25% Formation Organization Gain and −50% Investment Pool Contributions. During mobilization, the Ming Estates gain +5 Approval and the Maritime Houses receive −5. The Army and Fleet gain +5 under a mainland-first leader or receive −2 under a southern-expedition leader."
 fh_mainland_renunciation_approval_tt: "For 3 years, the Maritime Houses gain +2 Approval. The Army and Fleet receive −2 under a mainland-first leader or gain +2 under a southern-expedition leader."
 fh_mainland_disputed_mandate: "Disputed Mandate"
 fh_mainland_disputed_mandate_desc: "Until the court decides whom Tungning speaks for, its own ministers question the basis of its authority."
 fh_mainland_established_suppliers: "Established Naval Suppliers"
 fh_mainland_established_suppliers_desc: "The island’s suppliers keep the fleet provisioned while the court debates the claim."
 fh_mainland_mandate_reaffirmed: "Mandate Reaffirmed"
 fh_mainland_mandate_reaffirmed_desc: "The court has renewed the claim to speak for the Ming cause."
 fh_mainland_strait_settlement: "The Strait Settlement"
 fh_mainland_strait_settlement_desc: "Qing and Tungning have settled the old dispute and reopened trade across the strait."
 fh_mainland_unanswered_accord: "An Unanswered Accord"
 fh_mainland_unanswered_accord_desc: "The court has dropped the old claim without securing an agreement with Qing."
 fh_mainland_island_first: "The Island Comes First"
 fh_mainland_island_first_desc: "The court has put its resources behind the trade that sustains Tungning."
 fh_mainland_squadrons_stand_down: "Squadrons Stand Down"
 fh_mainland_squadrons_stand_down_desc: "The squadrons set aside plans for an intervention on the mainland."
 fh_mainland_renunciation_approval: "Welcomed Renunciation"
 fh_mainland_renunciation_disapproval: "Opposed Renunciation"

l_english:
 fh_je_mainland_claim: "The Claim Across the Strait"
 fh_je_mainland_claim_reason: "Two bundles share a cabinet in the record room: the Ming memorials, still tied as they came across, and the Qing dispatches, opened and answered. The first came over with the exiles; the second grows by one coastal report at a time. What remains unsettled is whose seal answers a petition from the coast, and whose word stands behind the answer.\n\nDoes the court still speak for the Ming? Reassert the claim at 200, or open talks with Qing at 0. Owning all ordinary land in Fujian, Guangdong, or Zhejiang settles the claim in reassertion’s favor, unless the court has reached the Taiping fork. Foreign treaty ports do not count."
 fh_je_mainland_claim_status: "$fh_mainland_claim_debate_status$"
 fh_mainland_claim_debate_status: "The court has not yet decided whether it still speaks for the Ming."
 fh_mainland_claim_offer_status: "The debate is suspended while the court waits up to 90 days for Qing’s answer. If Qing refuses or the offer lapses, the court renounces without an accord."
 fh_mainland_claim_blocked_trade_status: "The full Qing offer is unavailable: trade privileges need an eligible market arrangement and cannot be granted under full Isolationism. Without an accord, reaching 0 still renounces the claim."
 fh_mainland_claim_blocked_offer_status: "The full Qing offer is unavailable: Qing must be able to take a tributary, and the court cannot be at war with Qing or subject to another overlord. Without an accord, reaching 0 still renounces the claim."
 fh_mainland_claim_fork_status: "The Heavenly Kingdom has risen. The council must choose whether to act on the mainland claim; its decision remains available even if the rebellion ends."
 fh_mainland_claim_tone_status: "The court has agreed to reassert. It must now choose between a measured declaration and an open challenge."
 fh_mainland_claim_reasserted_header: "Reassert the Mainland Claim"
 fh_mainland_claim_ratified_header: "Renounce with the Strait Settlement"
 fh_mainland_claim_renounced_header: "Renounce without an Accord"
 fh_mainland_claim_abandoned_header: "Close the Book on the Mainland"
 fh_mainland_claim_reasserted_desc: "The court has reasserted the Ming claim and begun to muster for the coastal land not yet in its hands. The constitution will be debated when the mobilization ends."
 fh_mainland_claim_ratified_desc: "The court has traded the old claim for recognition as Qing’s tributary, a reduced tribute, and trade privileges. The constitution can now be debated, with Ming restoration closed."
 fh_mainland_claim_renounced_desc: "The court has dropped the mainland claim without a settlement with Qing. Existing diplomacy stands; the constitution can now be debated, with Ming restoration closed."
 fh_mainland_claim_abandoned_desc: "The court has set the dynastic project aside. The constitution can now be debated, with Ming restoration and the return to the mainland closed for good."
 fh_reopen_taiping_fork: "Call the Council Back"
 fh_reopen_taiping_fork_desc: "Return to the council’s decision on the mainland claim."
 fh_mainland_fork_ready_tt: "No council audience is open"
 fh_mainland_claim.1.t: "The Words of the Declaration"
 fh_mainland_claim.1.d: "The clerk unties the memorials with his penknife and reads the last of them aloud, standing, the way the exiles’ descendants read them at home: low, unhurried, without comment. Then he takes up the declaration the council has just drafted. The court renews its claim to the mainland. No one at the table asks him to strike the sentence. At the foot of the stairs a harbor runner waits with his bag open for the copies meant for the quays; the clerk keeps one hand flat on the stack."
 fh_mainland_claim.2.t: "The Last Chance"
 fh_mainland_claim.2.d: "A boatman comes up the steps ahead of the courier, still in his wet cape, and says the Heavenly Kingdom has risen against Qing. The council makes him repeat it twice. An old officer in the gallery says that the last time the mainland rose, the Zheng took ground in Fujian. A minister answers that what they brought home was refugees. The usher sets another lamp on the table."
 fh_mainland_claim_measured: "Issue a measured declaration."
 fh_mainland_claim_public: "Challenge Qing in public."
 fh_mainland_claim_abandon: "Close the book on the mainland."
 fh_mainland_claim_defer: "Leave the decision before the council."
 fh_mainland_claim_measured_tt: "Reassert the claim and mobilize. #bold Mandate Reaffirmed#!: +10 base Legitimacy (decays over 5 years). Radicals: −10% among claim backers, +2% among accommodation backers. Qing Relations: −30 (if Qing exists)."
 fh_mainland_claim_public_tt: "Reassert the claim and mobilize. #bold Mandate Reaffirmed#!: +10 base Legitimacy (decays over 7 years). Radicals: −10% among claim backers, +5% among accommodation backers. Qing Relations: −60 (if Qing exists)."
 fh_mainland_claim_abandon_tt: "Renounce without offering terms to Qing; permanently close mainland and Taiping aid routes. For 2 years: #bold The Island Comes First#! (+10% Trade Advantage) and #bold Squadrons Stand Down#! (−10% Military Goods Costs). Radicals: +2% among claim backers, −2% among Maritime Houses supporters."
 fh_mainland_mobilization_preview_tt: "#bold Mobilization Across the Strait#! (up to 3 years): +25% Formation Organization Gain, −50% Investment Pool Contributions. Approval: Ming Estates +5, Maritime Houses −5; Army and Fleet +5 under a mainland-first leader or −2 under a southern-expedition leader."
 fh_mainland_renunciation_approval_tt: "Approval for 3 years: Maritime Houses +2; Army and Fleet −2 under a mainland-first leader or +2 under a southern-expedition leader."
 fh_mainland_disputed_mandate: "Disputed Mandate"
 fh_mainland_disputed_mandate_desc: "Until the court says whom it speaks for, its own ministers question the ground of its authority."
 fh_mainland_established_suppliers: "Established Naval Suppliers"
 fh_mainland_established_suppliers_desc: "The island’s chandlers keep the fleet provisioned while the court debates the claim."
 fh_mainland_mandate_reaffirmed: "Mandate Reaffirmed"
 fh_mainland_mandate_reaffirmed_desc: "The court has renewed its claim to speak for the Ming cause."
 fh_mainland_strait_settlement: "The Strait Settlement"
 fh_mainland_strait_settlement_desc: "Qing and the court have settled the old dispute and reopened the strait to trade."
 fh_mainland_unanswered_accord: "An Unanswered Accord"
 fh_mainland_unanswered_accord_desc: "The court has dropped the old claim without an agreement from Qing."
 fh_mainland_island_first: "The Island Comes First"
 fh_mainland_island_first_desc: "The court has put its money into the trade that keeps the island."
 fh_mainland_squadrons_stand_down: "Squadrons Stand Down"
 fh_mainland_squadrons_stand_down_desc: "The squadrons have set aside their plans for the mainland."
 fh_mainland_renunciation_approval: "Welcomed Renunciation"
 fh_mainland_renunciation_disapproval: "Opposed Renunciation"

l_english:
 fh_journal_opening.1.t: "Names in the Margin"
 fh_journal_opening.1.d: "The palace clerk copied a petition for a village school onto the wrong sheet. By the time Father Luo asked for it back, a delegate from Sinkan had already read it. ‘Your children need readers too,’ the delegate said, and tapped the empty space beside the signatures.\n\nThe Yongli Articles have room for both their names. The clerk asks only what he is to write at the head of the page when the petition goes out in the court’s name."
 fh_journal_opening.1.a: "Leave the heading blank for now."
 fh_journal_opening.2.t: "Clearance for Xiamen"
 fh_journal_opening.2.d: "An Anping customs clerk finds an unused clearance form for Xiamen at the bottom of a drawer. On the back someone has worked out the duty on a cargo of tea. The clerk knows his father’s hand.\n\nAt court the officers ask what rights our ships still hold across the strait. The merchants want to know what it would take for one of those ships to clear the harbor openly again, with a clearance signed in the light of day."
 fh_journal_opening.2.a: "Lay both accounts before the council."
 fh_journal_opening.3.t: "Who Signs the Manifest?"
 fh_journal_opening.3.d: "A captain from West Borneo unrolls his cargo manifest. He has signed it three times: once for the dock clerk, once for the customs house, and once for a Dutch inspector who had stopped him offshore. After the crossing, only the Dutch signature is still legible.\n\nThe southern merchants want terms they can carry from port to port. The fleet asks whether it should send the next convoy out with an escort."
 fh_journal_opening.4.t: "A Letter from Manila"
 fh_journal_opening.4.d: "The Anping factor brings in a letter from Manila. The old Spanish seal is gone; the seal in its place is one the factor has never seen. Manila has changed masters, and the merchants ask who can now answer for the terms of the old Compact. The court will have more room to act if the city’s government can answer in its own name."
 fh_journal_opening.4.independent: "A letter comes from Manila with no Spanish countersignature. The factor turns it over twice before reading it aloud. The merchants there ask whether the next cargo can sail under the old Compact, and who will see it through the Strait of San Bernardino.\n\nThe council has eight years to answer the larger question: what place should an independent Manila hold in the court’s affairs?"
 fh_journal_opening.4.a: "Enter the letter in the register."
 fh_journal_opening.5.t: "The Blank County Rolls"
 fh_journal_opening.5.d: "An officer marks the road inland from the coast with the butt of his pen. The senior magistrate asks where the district keeps its land rolls. The officer has a map of every battery on the shore and no answer.\n\nThe court orders fresh registers ruled and bound. For the return to hold, it needs one whole coastal region where the magistrates can open their doors and the clerks can begin the incorporation."
 fh_journal_opening.5.a: "Have the registers ruled."
 fh_journal_opening.6.t: "The First Line of the Charter"
 fh_journal_opening.6.d: "A scribe is told to draft a charter of government. He has barely wet his brush when two drafts of the heading arrive. The assembly’s advocates have written ‘We, the delegates.’ The Zheng officers have left a space wide enough for the royal seal.\n\nHe lays both before the council and asks whose authority he should put on the first line."
 fh_journal_opening.6.ming: "The scribe has three drafts of the first line of the charter. One begins with the delegates of an assembly, one with the house of Zhu, and one with the sovereign of the house of Zheng. All three of the men who dictated them have asked for the same chair beside his desk.\n\nHe asks them to bring their drafts before the council."
 fh_journal_opening.6.a: "Let the sponsors make their cases."
 fh_journal_opening.7.t: "Chairs for the Delegates"
 fh_journal_opening.7.d: "The carpenters have borrowed benches from a school to seat the new assembly. A delegate asks who sent them. Nobody knows; the order was signed while the old government was still in office.\n\nThe convention has agreed to a republic. Now it must prove that delegates can take their seats and keep a government in office long enough for the charter to mean anything."
 fh_journal_opening.7.a: "Call the roll."
 fh_journal_opening.8.t: "The Zhu Seal"
 fh_journal_opening.8.d: "The chamberlain opens the old seal case and sets a fresh pad of ink beside it. A clerk of the Zheng household brings in the first cabinet papers and stops at the table. For thirty years his office has known exactly where its own seal belongs.\n\nThere will be a Zhu on the throne and a Zheng at the head of the cabinet. The first papers must show how the two will govern together."
 fh_journal_opening.8.a: "Send the papers through both offices."
 fh_journal_opening.9.t: "Under the Zheng Name"
 fh_journal_opening.9.d: "The chancery has scraped the old Ming heading from a wooden printing block. The engraver asks whether the new heading should read as it does on the court’s orders, or as it does on the harbor clearances that a foreign captain would recognize.\n\nThe Zheng have claimed the mandate in their own right. Their ministers must now keep the court together under the name they have chosen."
 fh_journal_opening.9.a: "Cut the new heading."
